name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建单文件版本
        run: bash build.sh
      - name: 校验产物
        run: test -s dist/index.html && grep -q "</html>" dist/index.html
