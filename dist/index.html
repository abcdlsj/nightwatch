<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1c20">
<title>代号：连锁 · 原型 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1c20; --panel:#1c2a30; --panel2:#25363d; --edge:#3a525c; --ink:#fbf7ee; --muted:#9fb3ba;
  --red:#e2473b; --blue:#2c8fe0; --gold:#f2a93b; --green:#35a86b; --purple:#8e5bd8;
  --card:#f0e4c7; --cink:#2a2130;
  --zh:'ZCOOL QingKe HuangYou','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
  --px:'Pixelify Sans','ZCOOL QingKe HuangYou','Noto Sans CJK SC',ui-monospace,monospace;
  --cw:46px; --ch:90px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 游戏本身就是暗色美术，明暗两种环境使用同一套色板 */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0f1c20; --panel:#1c2a30; } }
:root[data-theme="dark"]{ --bg:#0f1c20; --panel:#1c2a30; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#crt{position:fixed;inset:0;pointer-events:none;z-index:95;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

#app{position:relative;z-index:1;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding:8px}

/* ---------- 顶栏 ---------- */
#top{display:flex;gap:6px;align-items:stretch}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:9px;padding:3px 9px;
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06);font-family:var(--px);font-size:19px;line-height:1}
.chip .lbl{font-family:var(--zh);font-size:13px;color:var(--muted)}
.chip .sub{font-size:13px;color:var(--muted)}
.chip b{font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.chip.gold b{color:#ffd166}
.chip.hp b{color:#ff8a80}
.chip .shd{color:#8fe3ff;font-size:14px}
.chip.bump{animation:bump .3s}
.chip.shake{animation:shakeX .35s}
.ico{width:16px;height:16px;image-rendering:pixelated;display:block}
#top .sp{flex:1}
#roundChip b{color:#fff}
#roundChip.elite b{color:#ff9e5e}#roundChip.boss b{color:#ff5a5a}

/* ---------- 按钮 ---------- */
.btn{color:#fff;background:var(--edge);border:0;border-radius:10px;padding:8px 14px;font-size:18px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.5);text-shadow:0 2px 0 rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .08s,box-shadow .08s,filter .15s;line-height:1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:default}
.btn.sm{font-size:15px;padding:6px 10px;border-radius:8px}
.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold)}.btn.green{background:var(--green)}
.btn.big{font-size:22px;padding:12px 18px;flex:1}
.btn.on{background:#c9933a}
.btn b{font-family:var(--px)}

/* ---------- 舞台 ---------- */
#stage{position:relative;flex:1;min-height:200px;border-radius:14px;overflow:hidden;background:rgba(8,14,18,.55);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.4)}
#field{position:absolute;top:0;image-rendering:pixelated;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;gap:7px;padding:9px}
.layer[hidden]{display:none}
#prep{background:linear-gradient(to bottom,rgba(10,22,24,.35),rgba(10,22,24,.72))}

#preview{background:rgba(0,0,0,.32);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:5px;flex:none}
#preview .ph{display:flex;align-items:baseline;gap:8px}
#preview .ph span{font-size:13px;color:var(--muted)}
#preview .ph b{font-size:18px;font-weight:400}
#pvList{display:flex;flex-wrap:wrap;gap:4px;max-height:58px;overflow:hidden}
.pv{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);border-radius:6px;padding:1px 6px 1px 1px;font-family:var(--px);font-size:13px}
.pv img{width:24px;height:24px;image-rendering:pixelated}
.pv.elite{background:rgba(226,71,59,.35);box-shadow:inset 0 0 0 2px rgba(255,120,100,.5)}
#pvNote{font-size:12px;color:#ffc3b8;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#pvNote:empty{display:none}

#shopHead{display:flex;align-items:center;gap:6px}
#shopHead h2{margin:0;font-weight:400;font-size:22px;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#offers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;justify-content:center;min-height:0}
.offer{position:relative;background:var(--panel2);border-radius:11px;padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.05);min-height:0}
.offer .oname{font-size:15px;margin-top:2px}
.offer .oadj{font-size:13px;min-height:15px}
.offer .osz{font-size:12px;color:var(--muted)}
.offer .oflav{display:none}
.price.free{color:#9bf0b8;background:#173a28}
.offer .odesc{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:11px;line-height:1.35;color:#c5d2d6;text-align:center;padding:0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.offer .card.static{transform:scale(1.12);transform-origin:center top;margin-bottom:10px}
.price{margin-top:3px;display:inline-flex;align-items:center;gap:3px;background:#3b2a12;border-radius:7px;padding:3px 7px;font-family:var(--px);font-size:16px;color:#ffd166;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.price.cant{color:#b08a70;background:#2b2320}
.offer.sold{opacity:.35}
.offer.sold .card{visibility:hidden}
.offer.sold::after{content:'已售';position:absolute;top:36%;left:0;right:0;text-align:center;font-size:18px;color:var(--muted)}

/* ---------- 卡牌 ---------- */
.card{position:absolute;top:4px;width:calc(var(--cw) * var(--sz) - 4px);height:var(--ch);cursor:grab;touch-action:none;
  transition:left .2s cubic-bezier(.3,1.4,.5,1)}
.card .inner{position:absolute;inset:0;animation:bob 3.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
.card .face{position:absolute;inset:0;border-radius:8px;background:var(--tbg,var(--card));border:3px solid var(--tc,var(--cink));overflow:hidden;
  box-shadow:0 3px 0 rgba(0,0,0,.55),0 0 0 2px var(--cink),inset 0 0 0 1px rgba(0,0,0,.35)}
.card .tb{position:absolute;left:-6px;top:-7px;height:19px;min-width:19px;padding:0 3px;border-radius:5px;background:var(--tc);color:#1b1224;font-size:13px;line-height:19px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 0 0 2px #1b1224;z-index:2}
.card.t3 .tb{background:linear-gradient(135deg,#8ff4ff,#45dcff 50%,#e0b3ff)}
.card.t2 .tb{background:linear-gradient(135deg,#fff1a8,#ffc328)}
.card .band{height:8px;background:var(--tagc);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.card .nm{font-size:12px;color:var(--cink);text-align:center;line-height:1;margin-top:2px;white-space:nowrap}
.card .spr{display:block;width:32px;height:32px;margin:3px auto 0;image-rendering:pixelated}
.card.s3 .spr{width:48px;height:48px;margin-top:0}
.card .num{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:'Silkscreen','Pixelify Sans',ui-monospace,monospace;font-weight:700;font-size:15px;color:var(--cink);line-height:1;letter-spacing:.5px}
.card .cdv{position:absolute;left:0;right:0;top:8px;bottom:0;background:rgba(24,14,40,.5);transform-origin:top;transform:scaleY(var(--s,0))}
.card .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.card .holo{position:absolute;inset:0;pointer-events:none}
.card.t3 .holo{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 44%,rgba(200,150,255,.4) 50%,transparent 62%);
  background-size:260% 100%;animation:holo 2.6s linear infinite;mix-blend-mode:overlay}
.card .gem{position:absolute;left:5px;top:3px;width:7px;height:7px;background:var(--tc);transform:rotate(45deg);box-shadow:0 0 0 1px var(--cink);z-index:1}
.card.t1 .gem{box-shadow:0 0 0 1px var(--cink),0 0 3px #fff}
.card.t2 .inner{filter:drop-shadow(0 0 4px rgba(255,201,60,.65))}
.card.t3 .inner{filter:drop-shadow(0 0 6px rgba(111,230,255,.85))}
.card.t3 .gem{animation:tw .7s infinite alternate}
.card.rare .adj{box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 0 0 2px #1b1224,0 0 8px var(--ac)}
.card .adj{position:absolute;bottom:-7px;right:-6px;min-width:21px;height:21px;padding:0 3px;border-radius:6px;background:var(--ac);color:#1b1224;
  font-size:14px;line-height:21px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 0 0 2px #1b1224;z-index:2}
.card.pop{animation:pop .24s ease-out}
.card.pop .flash{animation:flash .24s ease-out}
.card.land{animation:land .32s ease-out}
.card.lifted{opacity:.25}
.card .am{position:absolute;right:2px;bottom:24px;z-index:3;font-size:9px;line-height:1;padding:1px 3px;border-radius:3px;background:#1a1c2cdd;color:#ffd166;font-weight:700;pointer-events:none}
.card.empty .face{filter:grayscale(1) brightness(.55)}
.card.haste .face{box-shadow:0 0 0 2px #8ff0c8,0 0 10px #8ff0c8aa}
.kwbox{margin:8px 0;padding:6px 8px;border-radius:8px;background:#ffffff0d;font-size:12px;display:grid;gap:3px}
.kwbox b{color:#ffd166;margin-right:6px}.kwbox span{color:var(--muted)}
.card.frozen .face::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(130,215,255,.6) 0 4px,rgba(210,245,255,.45) 4px 8px)}
.card.mergeT .face{box-shadow:0 3px 0 rgba(0,0,0,.55),inset 0 0 0 3px #ffd34d;animation:glow .6s infinite alternate}
.card.merge{animation:mergeA .5s ease-out}
.card.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;transition:none}
.card.ghost .inner{animation:none;filter:drop-shadow(0 12px 10px rgba(0,0,0,.55))}
.card.ghost.back{transition:transform .22s ease-in}
.card.nudge .face{box-shadow:0 3px 0 rgba(0,0,0,.55),0 0 0 2px #8ff0bb}
.card.static{position:relative;top:0;left:auto;flex:none;height:84px;cursor:grab}
.card.static.s1{width:46px}.card.static.s2{width:64px}.card.static.s3{width:82px;max-width:100%}
@media (hover:hover){.card:not(.ghost):hover .inner{transform:translateY(-3px) scale(1.04);animation-play-state:paused}}

/* ---------- 棋盘 ---------- */
#stashRow{display:flex;gap:7px}
#stashRow{max-height:calc(var(--ch) + 12px);transition:max-height .25s ease,opacity .2s,margin .25s;overflow:visible}
#stashRow.closed{max-height:0;opacity:0;margin-top:-7px;overflow:hidden;pointer-events:none}
#stash,#board{position:relative;height:calc(var(--ch) + 8px);border-radius:11px;background:rgba(0,0,0,.38);
  box-shadow:inset 0 3px 0 rgba(0,0,0,.35),0 3px 0 rgba(255,255,255,.04)}
#stash{width:calc(var(--cw) * 4 + 8px);flex:none;background:rgba(0,0,0,.28)}
#board{width:calc(var(--cw) * 8 + 8px);margin:0 auto;background:linear-gradient(rgba(60,40,26,.55),rgba(30,20,14,.7))}
.cell{position:absolute;top:4px;width:calc(var(--cw) - 4px);height:var(--ch);border-radius:8px;background:rgba(0,0,0,.25);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.cell.ok{background:rgba(53,168,107,.5);box-shadow:inset 0 0 0 2px #8ff0bb}
.cell.bad{background:rgba(226,71,59,.45)}
.cell.syn::after{content:'✦';position:absolute;top:36%;left:0;right:0;text-align:center;color:#ffd34d;font-size:18px;animation:tw .8s infinite alternate;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#sell{flex:1;border-radius:11px;border:2px dashed rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-size:14px;text-align:center;padding:4px;line-height:1.35;transition:transform .12s,background .12s}
#sell b{font-family:var(--px);color:#ffd166;font-size:18px}
#sell.armed{border-color:var(--gold);color:#ffd9a0;background:rgba(242,169,59,.12)}
#sell.hot{background:rgba(242,169,59,.32);transform:scale(1.04)}
#boardRow{position:relative}

#actions{display:flex;gap:7px}
#speedBtn{min-width:44px;font-family:var(--px);font-weight:700;padding:8px 8px;flex:none}
#goBtn{font-size:19px;padding:10px 8px;white-space:nowrap;min-width:0}
.fb{position:relative;flex-direction:column;font-size:12px;padding:5px 6px 4px;gap:2px;min-width:46px;flex:none}
.fb .ico{width:18px;height:18px}
.fb sup{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);font-family:var(--px);font-size:12px;padding:0 4px;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.fb sup:empty{display:none}
#bagBtn.on{background:#5a4a2a}#bagBtn.hot{background:var(--green);transform:scale(1.08)}#bagBtn.bad{background:var(--red)}
#treeBtn.glow{animation:glow .8s infinite alternate;box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 12px #ffd166}

/* ---------- 战斗 UI ---------- */
#bossbar{position:absolute;left:8px;right:8px;top:8px;background:rgba(20,6,10,.8);border-radius:10px;padding:6px 8px;
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,90,90,.35);display:flex;flex-direction:column;gap:4px;z-index:3}
#bossbar[hidden]{display:none}
#bossbar .bn{display:flex;justify-content:space-between;font-size:16px}
#bossbar .bn span{font-family:var(--px);font-size:14px;color:#ffb3a8}
.bhp{position:relative;height:9px;background:#1a1c2c;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.bhp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6b5b,#b8231a);transition:width .12s}
.bhp s{position:absolute;left:0;top:0;height:3px;background:#dfe6ee}
.intent{position:relative;display:flex;align-items:center;gap:6px;font-size:14px;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 6px;overflow:hidden}
.intent em{font-style:normal;font-family:var(--px);color:#ffd166;margin-left:auto}
.intent i{position:absolute;left:0;bottom:0;height:2px;background:#ff8a5b}
.intent.hot{background:rgba(255,80,60,.35);animation:blink .3s infinite alternate}
#chain{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:26px;pointer-events:none;opacity:0;z-index:4;
  text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 12px var(--cc,#c38cff);color:var(--cc,#e8d4ff)}
#chain.show{animation:chainPop .9s ease-out forwards}
#chain b{font-family:var(--px);font-size:30px}
#toast{position:absolute;left:50%;top:12px;transform:translate(-50%,0);background:rgba(20,14,26,.92);padding:9px 16px;border-radius:10px;font-size:17px;
  box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.1);opacity:0;pointer-events:none;z-index:6;width:max-content;max-width:92%;text-align:center}
#toast.show{animation:toastA 1.8s ease-out forwards}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:40px;pointer-events:none;opacity:0;z-index:5;
  text-shadow:0 4px 0 rgba(0,0,0,.6)}
#banner.show{animation:bannerA 1.3s ease-out forwards}

/* ---------- 战报 ---------- */
#report{background:rgba(10,14,20,.8);justify-content:flex-start}
.rp-title{font-size:26px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.rp-title.win{color:#9bf0b8}
.rp-list{display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0;flex:1}
.rp-row{display:grid;grid-template-columns:34px 44px 1fr auto;align-items:center;gap:6px;font-size:14px;opacity:0;animation:rowIn .3s ease-out forwards}
.rp-row img{width:32px;height:32px;image-rendering:pixelated}
.rp-row .bar{height:9px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.rp-row .bar i{display:block;height:100%;background:var(--tagc);width:0;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.rp-row b{font-family:var(--px);font-size:15px;text-align:right;min-width:62px}
.rp-row b small{color:var(--muted);font-size:11px;margin-left:3px;font-weight:400}
.rp-meta{text-align:center;font-size:14px;color:var(--muted)}
.rp-meta b{font-family:var(--px);color:#e0c8ff}
.rp-cash{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.cash-row{display:flex;justify-content:space-between;font-size:15px;opacity:0;animation:rowIn .25s ease-out forwards}
.cash-row b{font-family:var(--px);color:#ffd166}
.cash-row.total{border-top:2px dashed rgba(255,255,255,.15);padding-top:4px;font-size:18px}

/* ---------- 弹层 ---------- */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh{width:100%;max-width:440px;max-height:calc(100% - 20px);overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -4px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.06);animation:up .22s ease-out;display:flex;flex-direction:column;gap:10px}
.sh-top{display:flex;gap:14px;align-items:flex-start}
.sh-top .card{flex:none}
.sh h3{margin:0;font-weight:400;font-size:26px}
.sh .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:13px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.1)}
.sh p{margin:6px 0 0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:14px;line-height:1.55;color:#d8e2e5}
.adjbox{border-radius:9px;padding:7px 10px;background:rgba(0,0,0,.25);box-shadow:inset 3px 0 0 var(--ac)}
.adjbox b{color:var(--ac);font-weight:400;font-size:17px}
.adjbox span{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:14px;color:#d8e2e5;margin-left:6px}
.stat{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.22);border-radius:9px;padding:8px 10px}
.stat div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.stat div span:first-child{color:var(--muted);flex:none}
.stat div span:last-child{font-family:var(--px);text-align:right}
.stat .f{font-size:12px!important;color:#c9b8ff}
.sh-btns{display:flex;gap:8px}
.sh-btns .btn{flex:1}

/* ---------- 标题/结算屏 ---------- */
#screen{position:fixed;inset:0;z-index:85;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px;background:radial-gradient(ellipse at center,rgba(6,10,14,.35),rgba(6,10,14,.85));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#screen[hidden]{display:none}
.scr{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.logo{display:flex;gap:4px;font-size:84px;line-height:1}
.logo span{display:inline-block;color:#fff;text-shadow:0 6px 0 #7a1f1a,0 10px 0 rgba(0,0,0,.5);animation:logoB 2.4s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:.25s;color:#ffd166;text-shadow:0 6px 0 #8a5a12,0 10px 0 rgba(0,0,0,.5)}
.logo-sub{font-family:var(--px);letter-spacing:4px;color:#ffe3b0;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.rules{background:rgba(10,16,22,.75);border-radius:14px;padding:14px 16px;box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.07);
  display:flex;flex-direction:column;gap:8px;text-align:left;font-size:16px;line-height:1.45;width:100%}
.rules div{display:flex;gap:8px}
.rules i{font-style:normal;color:#ffd166;font-family:var(--px)}
.scr .btn.big{width:100%;flex:none}
.scr h1{margin:0;font-weight:400;font-size:44px;text-shadow:0 5px 0 rgba(0,0,0,.55)}
.scr .res{width:100%}


/* ---------- 遗物/备战 ---------- */
#relics{flex:1;display:flex;justify-content:flex-end;min-width:0}
.bagchip{border:0;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(208,166,255,.35)}
.bagchip b{color:#e0c8ff}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;max-height:30vh;overflow:auto;padding:4px}
.bag .relic{width:40px;height:40px}.bag .relic img{width:24px;height:24px}
.stat .mods{display:block!important;columns:2;column-gap:12px}
.stat .mods i{break-inside:avoid}
.relic{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:var(--panel);box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(208,166,255,.35);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.relic{position:relative;box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px var(--gc,#d0a6ff)!important}
.relic img{width:16px;height:16px;image-rendering:pixelated}
.relic sub{position:absolute;right:-3px;bottom:-4px;font-family:var(--px);font-size:11px;background:#1a1c2c;color:#fff;border-radius:4px;padding:0 3px;line-height:14px}
.relic.new{animation:bump .4s 3}
.steps{margin-left:auto;display:flex;gap:7px;align-self:center}
.steps i{display:block;width:9px;height:9px;background:rgba(255,255,255,.18);transform:rotate(45deg)}
.steps i.done{background:#ffd166}.steps i.now{background:#fff;animation:pulseO .6s infinite alternate}
@keyframes pulseO{from{opacity:.35}to{opacity:1}}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto}
.ptitle{font-size:21px;display:flex;align-items:baseline;justify-content:space-between;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.ptitle span{font-size:13px;color:var(--muted)}
.doors{display:flex;flex-direction:column;gap:9px;flex:1}
.door{flex:1;max-height:112px;min-height:64px;display:flex;align-items:center;gap:12px;text-align:left;color:#fff;border:0;border-radius:13px;padding:10px 12px;
  background:var(--panel2);box-shadow:0 4px 0 rgba(0,0,0,.5),inset 5px 0 0 var(--cc);cursor:pointer;transition:transform .1s,filter .15s;animation:doorIn .35s backwards}
.door:nth-child(2){animation-delay:.07s}.door:nth-child(3){animation-delay:.14s}
.door:active{transform:translateY(3px)}
@media (hover:hover){.door:hover,.opt:hover{filter:brightness(1.15)}}
.door img{width:52px;height:52px;image-rendering:pixelated;flex:none;background:rgba(0,0,0,.28);border-radius:11px;padding:4px}
.door div,.opt div{display:flex;flex-direction:column;gap:3px;min-width:0}
.door b{font-weight:400;font-size:20px;color:var(--cc)}
.door span{font-size:15px}
.door em,.ev-head em,.opt em,.flav{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-style:italic;font-size:12px;color:#8fa4ab;line-height:1.4}
.cat-shop{--cc:#ffd166}.cat-free{--cc:#7ee8a2}.cat-relic{--cc:#d0a6ff}.cat-up{--cc:#7cc4ff}.cat-misc{--cc:#8fe3e0}
.ev-head{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.3);border-radius:11px;padding:7px 10px;box-shadow:inset 4px 0 0 var(--cc)}
.ev-head img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.ev-head b{font-weight:400;font-size:19px;color:var(--cc);display:block}
.ev-hint{font-size:14px;color:var(--muted);text-align:center}
.ev-btns{display:flex;gap:8px;margin-top:auto;padding-top:8px;position:sticky;bottom:0;background:linear-gradient(transparent,rgba(12,22,26,.95) 30%)}.ev-btns .btn{flex:1}
.ev-btns small{font-size:12px;opacity:.8}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;color:#fff;border:0;border-radius:12px;padding:6px 10px;background:var(--panel2);
  box-shadow:0 4px 0 rgba(0,0,0,.5);cursor:pointer;animation:doorIn .3s backwards;min-height:56px;flex:none}
.opt:active{transform:translateY(3px)}
.opt .oc{flex:none;display:flex;justify-content:center;min-width:46px}
.opt .oc .card.static{pointer-events:none;height:78px}
.opt b{font-weight:400;font-size:17px}
.opt span{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:13px;color:#c5d2d6;line-height:1.4}
.ricon{width:40px;height:40px;image-rendering:pixelated;background:rgba(0,0,0,.3);border-radius:10px;padding:6px;flex:none;box-shadow:inset 0 0 0 2px var(--gc,transparent)}
.mg,.mb{display:block;font-style:normal;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:13px;line-height:1.45}
.mg{color:#8ff0b0}.mb{color:#ff8a80}
.gt{font-size:11px;margin-left:6px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.1);color:var(--gc,#c5d2d6);vertical-align:middle}
.opt .price{margin:0 0 0 auto;flex:none;color:#ffd166;font-family:var(--px);font-size:16px}
.opt .price.cant{color:#b08a70}
.opt.sold{opacity:.45;cursor:default}
.sh .mods{margin-top:6px}
.ricon.big{width:72px;height:72px;padding:10px}
.big-res{text-align:center;font-size:28px;margin:auto 0;line-height:1.5;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.big-res b{font-family:var(--px);color:#ffd166}
.big-res small{font-size:15px;color:var(--muted)}
.ready{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.rd-t{font-size:34px;color:#9bf0b8;text-shadow:0 3px 0 rgba(0,0,0,.5);animation:doorIn .4s}
.ready p{margin:0;font-size:16px}.ready .muted{font-size:13px;color:var(--muted);max-width:300px;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
.sh .flav{margin:0;padding:0 2px}
#goBtn.bump{animation:bump .4s}
@keyframes doorIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 人物/剧情/天赋 ---------- */
.tagline{margin:0;color:#ffe3b0;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.heroes{display:flex;flex-direction:column;gap:9px;width:100%}
.hero{display:grid;grid-template-columns:56px 1fr;gap:2px 10px;text-align:left;color:#fff;border:0;border-radius:14px;padding:9px 10px;background:rgba(16,22,30,.88);cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.5),inset 0 0 0 2px var(--hc);animation:doorIn .35s backwards;transition:transform .1s}
.hero:nth-child(2){animation-delay:.1s}.hero:active{transform:translateY(3px)}
.hero .por{grid-row:span 3;width:56px;height:56px;image-rendering:pixelated;background:rgba(0,0,0,.35);border-radius:12px;box-shadow:inset 0 0 0 2px var(--hc)}
.hero .hn b{font-weight:400;font-size:21px;color:var(--hc)}.hero .hn small{margin-left:8px;color:var(--muted);font-size:14px}
.htag{font-size:14px;color:var(--hc)}
.hero p,.hero em{grid-column:1/-1}
.hmeta{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.hero p{margin:2px 0 0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:12px;line-height:1.45;color:#d8e2e5}
.hstat{display:flex;gap:14px;font-size:14px;color:var(--muted)}.hstat b{font-family:var(--px);color:#fff}
.hcards{display:flex;gap:5px;margin-left:auto}.hcards img{width:26px;height:26px;image-rendering:pixelated;background:#efdfc8;border-radius:6px;padding:2px;box-shadow:0 0 0 2px #1b1224}
.hcards img.ex{background:#2a2140;box-shadow:0 0 0 2px var(--hc)}
.hero em{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-size:12px;color:#8fa4ab}
.por-big{width:96px;height:96px;image-rendering:pixelated}
#story{position:fixed;inset:0;z-index:88;background:radial-gradient(ellipse at 50% 30%,rgba(10,10,20,.35),rgba(4,6,10,.88));display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:20px 14px calc(28px + env(safe-area-inset-bottom,0px));cursor:pointer}
#story[hidden]{display:none}
.st-scene{width:min(420px,100%);aspect-ratio:120/68;image-rendering:pixelated;border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.1);margin:auto 0 12px}
.st-box{width:100%;max-width:420px;display:flex;gap:12px;align-items:flex-start;background:rgba(14,18,26,.95);border-radius:14px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.55),inset 0 0 0 2px var(--sc);animation:doorIn .25s}
.st-por{width:64px;height:64px;image-rendering:pixelated;flex:none;background:rgba(0,0,0,.4);border-radius:10px;box-shadow:inset 0 0 0 2px var(--sc)}
.st-body b{font-weight:400;font-size:18px;color:var(--sc)}
.st-body p{margin:6px 0 0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:16px;line-height:1.65;min-height:3.3em}
.st-tap{margin-top:10px;font-size:13px;color:var(--muted);animation:pulseO .8s infinite alternate}
.st-skip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.st-title{margin:0 0 auto;text-align:center;animation:doorIn .5s}
.st-title small{display:block;font-size:15px;color:#c79bff;letter-spacing:4px;margin-bottom:10px}
.st-title h2{margin:0;font-weight:400;font-size:38px;color:#ffe3b0;text-shadow:0 4px 0 rgba(0,0,0,.6),0 0 24px rgba(255,200,120,.35)}
.spn{font-size:14px;color:var(--muted);margin-left:8px}.spn b{font-family:var(--px);color:#ffd166;font-size:18px}
.muted2{margin:0!important;font-size:13px!important;color:var(--muted)!important}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.br{display:flex;flex-direction:column;align-items:stretch;gap:0}
.brn{text-align:center;font-size:17px;color:var(--bc);margin-bottom:6px}
.node{border:0;border-radius:10px;padding:7px 6px;background:rgba(0,0,0,.3);color:#8a9aa0;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);cursor:default;min-height:74px}
.node b{display:block;font-weight:400;font-size:15px;margin-bottom:2px}
.node .mg,.node .mb{font-size:11px}
.node[aria-disabled] .mg{color:#6f8a7a}
.node.can{background:rgba(255,209,102,.12);color:#fff;box-shadow:inset 0 0 0 2px var(--bc),0 0 10px var(--bc);cursor:pointer;animation:glow .7s infinite alternate}
.node.on{background:var(--bc);color:#1b1224;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.node.on .mg{color:#1b1224}
.lnk{display:block;width:3px;height:10px;margin:0 auto;background:rgba(255,255,255,.18)}
.bagchip{white-space:nowrap;flex:none}.bagchip .lbl{white-space:nowrap}
.scr .btn.alt{background:var(--edge)}
.cat-rare{--cc:#e0b3ff}.door.cat-rare{box-shadow:0 4px 0 rgba(0,0,0,.5),inset 5px 0 0 var(--cc),0 0 12px rgba(224,179,255,.45)}
.tlog{display:flex;flex-direction:column;gap:6px}
.tl{display:flex;gap:8px;align-items:flex-start;animation:doorIn .25s}
.tl img{width:32px;height:32px;image-rendering:pixelated;flex:none;background:rgba(0,0,0,.35);border-radius:7px;box-shadow:inset 0 0 0 2px var(--vc)}
.tl p{margin:0;background:rgba(0,0,0,.35);border-radius:4px 10px 10px 10px;padding:5px 9px;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:13px;line-height:1.45;color:#efe6d2;box-shadow:inset 3px 0 0 var(--vc)}
.tl p b{display:block;font-family:var(--zh);font-weight:400;font-size:12px;color:var(--vc)}
.tl.me{flex-direction:row-reverse}.tl.me p{border-radius:10px 4px 10px 10px;box-shadow:inset -3px 0 0 var(--vc);text-align:right}
.opt.say{min-height:0;padding:9px 12px}.opt.say b{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:14px;line-height:1.4}
.opt b small.gt{font-family:var(--zh)}
.tlist{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.trow{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 9px;box-shadow:inset 3px 0 0 var(--gc)}
.trow .ricon{width:36px;height:36px;padding:5px;box-shadow:inset 0 0 0 2px var(--gc)}
.trow div{display:flex;flex-direction:column;gap:2px;min-width:0}.trow b{font-weight:400;font-size:16px;color:var(--gc)}
.relrow{border:0;color:#fff;text-align:left;cursor:pointer;width:100%;font-family:inherit}.relrow .mods{font-size:12px;display:flex;flex-wrap:wrap;gap:0 8px}
.trow em{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-size:12px;color:#c9bda8}

/* ---------- 战斗内台词 / 新敌人卡片（纯表现，不接收点击） ---------- */
.bark{position:absolute;left:8px;right:8px;bottom:52px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:7;opacity:0;
  background:rgba(12,10,20,.86);border-radius:10px;padding:6px 10px 6px 6px;box-shadow:0 3px 0 rgba(0,0,0,.5),inset 3px 0 0 var(--vc,#fff);max-width:92%;width:max-content}
.bark img{width:32px;height:32px;image-rendering:pixelated;flex:none;background:rgba(255,255,255,.06);border-radius:7px}
.bark b{display:block;font-weight:400;font-size:13px;color:var(--vc,#fff)}
.bark p{margin:1px 0 0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:14px;line-height:1.4;color:#f1ece0}
.bark.foe{left:auto;right:8px;flex-direction:row-reverse;text-align:right;box-shadow:0 3px 0 rgba(0,0,0,.5),inset -3px 0 0 var(--vc,#fff)}
.bark.sub{left:0;right:0;max-width:none;width:auto;justify-content:center;border-radius:0;top:38%;bottom:auto;padding:8px 18px;
  background:linear-gradient(90deg,transparent,rgba(8,6,14,.82) 20%,rgba(8,6,14,.82) 80%,transparent);box-shadow:none}
.bark.sub p{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-style:italic;font-size:15px;color:#e6dcc4;text-align:center;letter-spacing:1px}
.bark.show{animation:barkA var(--dur,2600ms) ease-out forwards}
@keyframes barkA{0%{opacity:0;transform:translateY(8px)}7%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
#foeCard{position:absolute;right:8px;top:8px;width:220px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:8;opacity:0;
  background:rgba(20,8,12,.8);border-radius:10px;padding:7px 9px;box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px var(--fc,#ff8a80)}
#foeCard img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;flex:none}
#foeCard small{font-size:11px;color:var(--fc)}#foeCard b{display:block;font-weight:400;font-size:16px}
#foeCard p{margin:2px 0 0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:12px;line-height:1.4;color:#d8d0c8}
#foeCard.show{animation:foeA 4.5s ease-out forwards}
@keyframes foeA{0%{opacity:0;transform:translateX(30px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateX(10px)}}
.tsay{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.3);border-radius:10px;padding:7px 10px;box-shadow:inset 3px 0 0 var(--hc);animation:doorIn .3s}
.tsay img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.tsay p{margin:0;font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-style:italic;font-size:14px;color:#efe6d2;line-height:1.45}
.node .nq{display:block;font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-style:italic;font-size:11px;line-height:1.35;color:#c9bda8;margin-top:3px}
/* ---------- 卡牌精细化：纸面纹理、内框、品质装饰、传闻 ---------- */
.card .face{background-image:repeating-linear-gradient(135deg,rgba(60,40,20,.035) 0 2px,transparent 2px 5px),linear-gradient(var(--tbg,var(--card)),var(--tbg,var(--card)))}
.card .face::before{content:'';position:absolute;left:2px;right:2px;top:10px;bottom:2px;border:1px solid rgba(40,28,20,.14);border-radius:4px;pointer-events:none}
.card.t1 .face::before{border-color:rgba(120,140,165,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.card.t2 .face::before{border:1px solid rgba(190,130,20,.6);
  background:linear-gradient(#c8901e,#c8901e) left top/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) left top/1px 5px no-repeat,
  linear-gradient(#c8901e,#c8901e) right top/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) right top/1px 5px no-repeat,
  linear-gradient(#c8901e,#c8901e) left bottom/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) left bottom/1px 5px no-repeat,
  linear-gradient(#c8901e,#c8901e) right bottom/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) right bottom/1px 5px no-repeat}
.card.t3 .face::before{border-color:rgba(80,200,255,.7);box-shadow:inset 0 0 6px rgba(120,230,255,.45)}
.card.t2 .holo{background:linear-gradient(115deg,transparent 40%,rgba(255,250,220,.55) 48%,transparent 56%);background-size:300% 100%;animation:holo 5.5s linear infinite;mix-blend-mode:overlay}
.card.t3 .inner::before{content:'';position:absolute;inset:-2px;border-radius:10px;background:conic-gradient(from var(--ang,0deg),#6fe6ff,#e0b3ff,#fff3b0,#6fe6ff);animation:spinB 3s linear infinite;z-index:-1}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinB{to{--ang:360deg}}
.card .spr{filter:drop-shadow(0 1px 0 rgba(0,0,0,.28))}
.card .nm.long{font-size:10px;letter-spacing:-.5px}
.card.t3 .nm{color:#1b3a5c;font-weight:700}
.sh h3 .dn{background:linear-gradient(90deg,#8ff4ff,#e0b3ff,#fff3b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sh h3 .bn{font-size:14px;color:var(--muted);margin-left:6px}
.lore{border-radius:9px;padding:8px 11px;background:linear-gradient(135deg,rgba(255,201,60,.12),rgba(0,0,0,.25));box-shadow:inset 3px 0 0 #ffc93c}
.lore small{font-size:12px;color:#ffc93c;letter-spacing:2px}
.lore p{margin:3px 0 0;font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-size:13px;line-height:1.6;color:#efe3c6}
.lore .dl{color:#bfefff;font-style:italic}
.lore.dia{background:linear-gradient(135deg,rgba(111,230,255,.14),rgba(224,179,255,.1),rgba(0,0,0,.25));box-shadow:inset 3px 0 0 #6fe6ff}
.lore.dia small{color:#8ff4ff}
.lore.locked{background:rgba(0,0,0,.2);box-shadow:inset 3px 0 0 rgba(255,255,255,.15)}
.lore.locked small{color:var(--muted)}.lore.locked p{color:var(--muted);font-style:italic}
.scr{margin:auto}
/* ---------- 动画 ---------- */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-2px) rotate(.7deg)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-3deg)}70%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
@keyframes land{0%{transform:translateY(-12px) scale(1.08)}55%{transform:translateY(2px) scale(1.04,.94)}100%{transform:none}}
@keyframes mergeA{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(6deg)}60%{transform:scale(.9) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes holo{0%{background-position:130% 0}100%{background-position:-130% 0}}

function mkSprite(rows,fill){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');
  for(let j=0;j<h;j++){const r=rows[j];for(let i=0;i<r.length;i++){const c=r[i];if(c==='.')continue;x.fillStyle=fill||PAL[c]||'#f0f';x.fillRect(i,j,1,1);}}
  return cv;
}
function upURL(cv,s){const c2=document.createElement('canvas');c2.width=cv.width*s;c2.height=cv.height*s;const x=c2.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(cv,0,0,c2.width,c2.height);return c2.toDataURL();}
const SPR={};
for(const k in SPRITES){const cv=mkSprite(SPRITES[k]);SPR[k]={cv,w:cv.width,h:cv.height,white:mkSprite(SPRITES[k],'#ffffff'),ice:mkSprite(SPRITES[k],'#8fe3ff'),url:upURL(cv,4)};}
document.querySelectorAll('[data-ico]').forEach(im=>{im.src=SPR[im.dataset.ico].url;});

for(const h in TREES)TREES[h].forEach((br,b)=>br.nodes.forEach((nd,i)=>{
  const m={};for(const k in nd.m){const v=nd.m[k];m[k]=Math.abs(v)<1?Math.round(v*1.3*100)/100:v;}
  TALENTS[h+'_'+b+i]={n:nd.n,cat:(_TCATS[h]||[])[b]||'atk',r:i,m,hero:h,say:((TREE_SAY[h]||[])[b]||[])[i]||''};
}));
function talentOk(id){const T=TALENTS[id];return T&&!G.skills.includes(id)&&(!T.hero||T.hero===G.hero);}
function rollTalents(n,bias){
  const out=[];const pool=Object.keys(TALENTS).filter(talentOk);
  const w=id=>{const T=TALENTS[id];return[6,3,1.3][T.r]*(T.hero?1.5:1)*(bias&&T.cat===bias?3:1)*(T.r===2&&G.round<3?.3:1);};
  while(out.length<n){const p=pool.filter(k=>!out.includes(k));if(!p.length)break;
    let t=Math.random()*p.reduce((s,k)=>s+w(k),0);let got=p[p.length-1];for(const k of p){t-=w(k);if(t<=0){got=k;break;}}out.push(got);}
  return out;
}
function learnTalent(id){if(!talentOk(id))return;G.skills.push(id);const w=TALENTS[id].m.wall;if(w){G.wallMax+=w;G.wall+=w;}
  recalcMods();renderOwned();updateHUD();SFX.play('merge');toast('学会了：'+TALENTS[id].n);}
function talentText(id){const T=TALENTS[id];return T.d||modText(T.m);}

/* ================= 音效 ================= */
const SFX=(function(){
  let ac=null,muted=false;const last={};
  function ensure(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}if(ac&&ac.state==='suspended')ac.resume();}
  function tone(f,d,type,vol,slide,delay){if(!ac||muted)return;const t=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03);}
  function noise(d,vol){if(!ac||muted)return;const n=Math.floor(ac.sampleRate*d);const b=ac.createBuffer(1,n,ac.sampleRate);const a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(ac.destination);s.start();}
  const TP={'刃':520,'火':300,'电':660,'冰':780,'机':220,'毒':440};
  function play(k,p){if(!ac||muted)return;const now=performance.now();const lk=k==='echo'?k+p:k;if(last[lk]&&now-last[lk]<(k==='hit'?60:40))return;last[lk]=now;
    switch(k){
      case'fire':tone(TP[p]||400,.05,'square',.018,1.4);break;
      case'hit':tone(140,.05,'square',.015,.6);break;
      case'crit':tone(990,.09,'square',.035,.5);tone(1480,.06,'triangle',.03,1,.03);break;
      case'kill':tone(260,.09,'triangle',.03,.35);break;
      case'coin':tone(988,.05,'square',.03);tone(1319,.1,'square',.03,1,.05);break;
      case'echo':tone(392*Math.pow(1.122,Math.min(p,12)),.09,'triangle',.045,1.25);break;
      case'pick':tone(500,.04,'square',.025,1.6);break;
      case'place':tone(300,.06,'square',.035,.7);break;
      case'buy':tone(660,.05,'square',.03);tone(990,.08,'square',.03,1,.05);break;
      case'sell':tone(880,.05,'square',.03);tone(587,.09,'square',.03,1,.05);break;
      case'merge':[523,659,784,1047].forEach((f,i)=>tone(f,.1,'square',.035,1,i*.06));break;
      case'hurt':noise(.18,.12);tone(90,.2,'sawtooth',.05,.5);break;
      case'boom':noise(.25,.1);tone(70,.25,'square',.05,.4);break;
      case'bell':tone(523,.6,'triangle',.05);tone(784,.5,'triangle',.03,1,.02);break;
      case'intent':tone(180,.25,'sawtooth',.04,1.8);break;
      case'win':[523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.035,1,i*.08));break;
      case'lose':[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.05,1,i*.16));break;
      case'ui':tone(700,.03,'square',.02);break;
      case'bad':tone(160,.12,'square',.04,.8);break;
    }}
  return{ensure,play,toggle(){muted=!muted;return muted;}};
})();

function fits(z,idx,size,ignore){const n=zoneN(z);if(idx<0||idx+size>n)return false;const o=occ(z);for(let i=idx;i<idx+size;i++)if(o[i]&&o[i]!==ignore)return false;return true;}
function firstFit(size){for(const z of['board','stash'])for(let i=0;i+size<=zoneN(z);i++)if(fits(z,i,size))return{z,i};return null;}
function neighbors(c){if(c.loc!=='board')return[];const o=occ('board');const r=[];const L=o[c.idx-1],R=o[c.idx+c.size];if(L)r.push(L);if(R)r.push(R);return r;}

/* ---- 事件触发：卡牌 / 物品在数据里声明 on:{事件:(卡,上下文)=>{}}，引擎在对应时机 emit ---- */
function evOk(log,k,cap){const a=(log[k]=(log[k]||[]).filter(t=>t>B.t-1));if(a.length>=cap)return false;a.push(B.t);return true;}
function emit(ev,x){
  if(!B||B.over||G.phase!=='battle')return;x=x||{};
  for(const c of boardCards()){const h=ITEMS[c.key].on;if(!h||!h[ev]||c.frozen>0)continue;if(!evOk(c.evLog||(c.evLog={}),ev,8))continue;h[ev](c,x);if(B.over)return;}
  for(const r of new Set(G.relics)){const h=RELICS[r].on;if(!h||!h[ev])continue;if(!evOk(B.rlog,r+ev,8))continue;h[ev](G.relics.filter(y=>y===r).length,x);if(B.over)return;}
  for(const s of G.skills){const h=TALENTS[s]&&TALENTS[s].on;if(!h||!h[ev])continue;if(!evOk(B.rlog,'T'+s+ev,8))continue;h[ev](x);if(B.over)return;}
}
const kindOf=c=>ITEMS[c.key].kind||'';
function countKind(k,ex){return boardCards().filter(o=>o!==ex&&kindOf(o)===k).length;}
function countTag(t,ex){return boardCards().filter(o=>o!==ex&&ITEMS[o.key].tag===t).length;}
function maxAmmo(c){const a=ITEMS[c.key].ammo;return a==null?null:a+stepOf(c)+mv('ammo');}
function buffAmt(c){const it=ITEMS[c.key];let a=it.buff*(1+.2*stepOf(c))+(c.rage||0);if(it.buffKind)a+=it.buffKind.amt*countKind(it.buffKind.kind);return a;}
function growCard(c,v){c.grow=(c.grow||0)+v*(1+mv('t_photo'));if(c.el)setNum(c.el,c);}
function questN(c){const q=ITEMS[c.key].quest;return q?Math.ceil(q.n*(mv('t_map')?.5:1)):0;}
function questAdd(c,v){if(ITEMS[c.key].quest)c.qp=(c.qp||0)+(v||1);}
function finishQuests(){for(const c of G.cards){const q=ITEMS[c.key].quest;if(!q||(c.qp||0)<questN(c))continue;
  const from=ITEMS[c.key].n;c.key=q.into;c.qp=0;if(mv('t_map'))c.tier=Math.min(3,c.tier+1);repaint(c);toast('【任务完成】'+from+' 变成了 '+ITEMS[c.key].n);
  if(c.el)setTimeout(()=>{if(!c.el)return;restart(c.el,'merge');const r=c.el.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,'#ffd166',30);},60);}}
function stats(c,t){
  const it=ITEMS[c.key],a=c.adj,s=stepOf(c),U=UPS[it.up];
  const base=Math.round((it.dmg*U.d[s]+(it.dmg>0?(c.grow||0)+(c.stk||0):0))*10)/10;
  const flat=(a==='sharp'&&it.dmg>0)?4*it.size*(c.tier+1):0;
  const pct=[];
  if(a==='fervor')pct.push(['狂热',.3]);if(a==='heavy')pct.push(['沉重',.5]);
  if(a==='resonance'){const nb=c.nb||neighbors(c);const n=nb.filter(x=>ITEMS[x.key].tag===it.tag).length;if(n)pct.push(['共鸣×'+n,.25*n]);}
  const mp=(k,l)=>{const v=mv(k);if(v)pct.push([l,v]);};
  if(it.per&&c.loc==='board'){const P=it.per;let n=0;
    if(P.elem)n=new Set(boardCards().map(o=>ITEMS[o.key].tag)).size;else if(P.kind)n=countKind(P.kind,c);else if(P.tag)n=countTag(P.tag,c);
    if(n)pct.push([(P.elem?'元素':P.kind||P.tag)+'×'+n,P.pct*n]);}
  if(mv('t_alch')&&c.loc==='board'){const n=countKind('药剂');if(n)pct.push(['炼金手册×'+n,.04*n*mv('t_alch')]);}
  mp('dmg','加成');mp('tag_'+it.tag,'加成·'+it.tag);mp('s'+it.size,'加成·'+SIZEN[it.size]+'型');
  if(c.loc==='board'){const bc=boardCards();if(bc[0]===c)mp('left','最左');if(bc[bc.length-1]===c)mp('right','最右');
    if(mv('lonely')&&!(c.nb||neighbors(c)).length)mp('lonely','孤狼');if(mv('full')&&occ('board').every(Boolean))mp('full','满员');}
  const psum=pct.reduce((s,p)=>s+p[1],0);const mult=a==='deadly'?1.5:1;
  const total=(base+flat)*Math.max(.1,1+psum)*mult;
  let cd=it.cd*U.c[s];if(a==='twin')cd*=1.6;if(a==='heavy')cd*=1.3;
  let spd=1;if(a==='swift')spd+=.25;if(a==='momentum'&&c.mom)spd+=.05*c.mom;if(a==='rush'&&t!=null&&t<5)spd+=1;if(it.kind==='药剂'&&c.loc==='board'){const j=boardCards().filter(o=>ITEMS[o.key].kindHaste).length;if(j)spd+=.06*j*countKind('药剂');}
  if(mv('t_last')&&G.wall<G.wallMax*.35)spd+=.25;
  spd=Math.max(.3,spd+mv('spd'));
  return{base,flat,pct,psum,mult,total,cd:Math.max(.25,cd/spd),cdRaw:it.cd,crit:.05+(a==='precise'?.2:0)+mv('crit')};
}
function basePrice(k,adj,tier){return[3,6,10,16][tier]+(ITEMS[k].size-1)+(adj?[1,2,3][ADJ[adj].r]:0);}
function sellValue(c){return Math.max(1,Math.floor(basePrice(c.key,c.adj,c.tier)/2))+c.hoard;}

/* ================= 卡牌生成 ================= */
function rollAdj(key,force,exclude,maxTier){
  if(!force&&Math.random()>.12)return null;
  const r=Math.random();const rare=.06+.025*G.round;const unc=.3;
  let tier=r<rare?2:r<rare+unc?1:0;
  if(maxTier!==undefined)tier=Math.min(tier,maxTier);
  let pool=Object.keys(ADJ).filter(k=>ADJ[k].r===tier);
  if(ITEMS[key].dmg===0)pool=pool.filter(k=>ADJ_NODMG.includes(k));
  if(exclude)pool=pool.filter(k=>k!==exclude);
  if(!pool.length)pool=ADJ_NODMG.filter(k=>k!==exclude);
  return pick(pool);
}
function rollItem(filter){
  const R=G.round;const pool=[];
  for(const k in ITEMS){const it=ITEMS[k];if(it.noPool||(it.hero&&it.hero!==G.hero))continue;if(filter&&!filter(it))continue;if(it.t===2&&R<2)continue;
    const w=(it.size===1?4:it.size===2?3:R>=4?2.5:1.3)*(it.hero?1.4:1);pool.push([k,w]);}
  if(!pool.length)return pick(Object.keys(ITEMS).filter(k=>!ITEMS[k].noPool&&!ITEMS[k].hero));
  let t=Math.random()*pool.reduce((a,b)=>a+b[1],0);for(const[k,w]of pool){t-=w;if(t<=0)return k;}return pool[0][0];
}
function makeOffer(filter,opt){opt=opt||{};
  const key=rollItem(filter);let tier=ITEMS[key].t;
  if(opt.black||Math.random()<(G.round>=5?.18:G.round>=3?.08:0))tier=Math.min(opt.free?2:3,tier+1);
  const adj=rollAdj(key,!!opt.black);
  let price=basePrice(key,adj,tier);if(opt.black)price=Math.round(price*1.5);if(opt.free)price=0;
  return{card:{key,tier,adj,size:ITEMS[key].size,dl:0,hoard:0},price,sold:false};
}

  if(G.firstPrep&&!G.prep.talk){G.firstPrep=false;setTimeout(()=>toast('每夜之前能走三个地方，挑着去'),500);}

function rollDoors(){
  const R=G.round,P=G.prep;
  const ids=Object.keys(EVENTS).filter(id=>{const e=EVENTS[id];return(!e.minR||R>=e.minR)&&(!e.need||e.need());});
  const isRare=i=>EVENTS[i].cat==='rare';const out=[];
  if(R===1&&P.step===0)out.push('shop','field');
  while(out.length<3){const pool=ids.filter(i=>!out.includes(i)&&!(isRare(i)&&(P.rare||out.some(isRare))));if(!pool.length)break;
    let t=Math.random()*pool.reduce((s,i)=>s+EVENTS[i].w,0);let got=null;for(const i of pool){t-=EVENTS[i].w;if(t<=0){got=i;break;}}out.push(got||pool[pool.length-1]);}
  if(!out.some(i=>EVENTS[i].cat==='shop'||EVENTS[i].cat==='free'))out[out.findIndex(i=>!isRare(i))]='shop';
  if(out.some(isRare))P.rare=1;
  P.doors=out.sort(()=>Math.random()-.5);
}

    cur.opts=shuffled(G.cards).slice(0,3).map(c=>{const a=rollAdj(c.key,true,c.adj,1);return{card:c,label:ITEMS[c.key].n+' → 【'+ADJ[a].n+'】',sub:ADJ[a].d,
      act:()=>{c.adj=a;repaint(c);renderOwned();SFX.play('merge');const r=c.el.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,ADJ[a].c,20);restart(c.el,'merge');finishStep();}};});}
  else if(id==='train'){cur.mode='choice';cur.hint='挑一张卡升一档';
    cur.opts=shuffled(G.cards.filter(c=>c.tier<2)).slice(0,3).map(c=>{const nx=Object.assign({},c,{tier:c.tier+1});const a=stats(c,null),b=stats(nx,null);
      return{card:c,label:ITEMS[c.key].n+'：'+TIERS[c.tier].n+' → '+TIERS[c.tier+1].n,sub:ITEMS[c.key].dmg?`伤害 ${Math.round(a.total)}→${Math.round(b.total)}　冷却 ${a.cd.toFixed(2)}→${b.cd.toFixed(2)}s`:UPS[ITEMS[c.key].up].t,
      act:()=>{c.tier++;repaint(c);checkMerges();renderOwned();SFX.play('merge');if(c.el){const r=c.el.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,TIERS[c.tier].c,24);restart(c.el,'merge');}finishStep();}};});}
  else if(id==='furnace'){cur.mode='choice';cur.hint='挑一张卡扔进去';
    cur.opts=shuffled(G.cards).slice(0,4).map(c=>({card:c,label:'献祭 '+ITEMS[c.key].n,sub:'这张卡就没了（值 '+sellValue(c)+' 金），换一件遗物',
      act:()=>{const r=c.el.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,'#ef7d57',26);SFX.play('boom');removeCard(c);renderOwned();relicChoice(cur,'熔炉吐出三件遗物，选一件',rollGear(3,3));renderPrep();}}));}
  else if(id==='gamble'){cur.mode='gamble';}

  else if(id==='manual'){cur.mode='pick';cur.offers=[0,1].map(()=>makeOffer(it=>it.hero===G.hero&&it.t>=1,{free:1}));}

  else if(id==='bank'){const g=Math.max(2,Math.round(G.gold*.3));cur.mode='reward';cur.text=`利息 <b>+${g}</b> 金`;cur.apply=()=>gainGold(g);}
  P.cur=cur;renderPrep();
}
/* ---- 夜谈 / 学天赋 ---- */
function startTalk(){const sc=TALKS[Math.floor((G.round-1)/2)%TALKS.length];

function tline(who,t){const v=voiceOf(who);return `<div class="tl${who==='hero'?' me':''}" style="--vc:${v.c}"><img src="${v.img}" alt=""><p><b>${v.n}</b>${pickLine(t)}</p></div>`;}

function endTalk(cur){if(cur.talk){G.prep.talkDone=true;G.prep.cur=null;renderPrep();
    if(G.firstPrep){G.firstPrep=false;setTimeout(()=>toast('这局来的是「'+FOESETS[G.foeSet].n+'」，先去三个地方准备'),700);}}else finishStep();}
function gainGold(n){G.gold+=n;SFX.play('coin');const r=$('#pbody').getBoundingClientRect();FX.coins(r.left+r.width/2,r.top+r.height/2,Math.min(n,8));}
function rollGear(n,bonus,maxTier){const R=G.round+(bonus||0);const w=[Math.max(10,62-8*R),24+2*R,R>=2?4+4*R:0,R>=4?2*R-4:0];
  if(maxTier!==undefined)for(let i=maxTier+1;i<4;i++)w[i]=0;
  const out=[];let guard=0;while(out.length<n&&guard++<200){let t=Math.random()*w.reduce((a,b)=>a+b,0);let tier=0;for(let i=0;i<4;i++){t-=w[i];if(t<=0){tier=i;break;}}
    const pool=Object.keys(RELICS).filter(k=>RELICS[k].t===tier&&(!RELICS[k].hero||RELICS[k].hero===G.hero)&&!out.includes(k)&&!(RELICS[k].u&&G.relics.includes(k)));if(pool.length)out.push(pick(pool));}
  return out;}
function gearPrice(k){return[5,9,14,20][RELICS[k].t]+Math.floor(G.round/2);}
function gearLabel(k){const g=RELICS[k];const n=G.relics.filter(x=>x===k).length;return `<span style="color:${GT[g.t].c}">${g.n}</span><small class="gt" style="--gc:${GT[g.t].c}">${GT[g.t].n}</small>${n?'<small class="gt">已有'+n+'</small>':''}`;}
function relicChoice(cur,hint,list){cur.mode='relic';cur.hint=hint;
  cur.opts=list.map(r=>({ico:RELICS[r].ico,gt:RELICS[r].t,label:gearLabel(r),sub:modText(RELICS[r].m),flav:RELICS[r].f,act:()=>gainRelic(r)}));}
function gainRelic(r,stay){G.relics.push(r);const w=RELICS[r].m.wall;if(w){G.wallMax=Math.max(5,G.wallMax+w);G.wall=w>0?G.wall+w:Math.min(G.wall,G.wallMax);}
  recalcMods();SFX.play('merge');renderRelics(r);renderOwned();updateHUD();toast('拿到遗物：'+RELICS[r].n);if(!stay)finishStep();}
function shuffled(a){return a.slice().sort(()=>Math.random()-.5);}
function finishStep(){const P=G.prep;P.step++;P.cur=null;if(P.step<3)rollDoors();renderPrep();SFX.play('ui');
  if(P.step>=3)restart($('#goBtn'),'bump');}

/* ================= 获得/出售/合成 ================= */
function buyCheck(of){if(G.gold<of.price){toast('钱不够');restart($('#goldChip'),'shake');SFX.play('bad');return false;}return true;}
function acquire(of,dest){
  if(of.sold||G.phase!=='prep')return false;
  const canMerge=of.card.tier<3&&countSame(of.card.key,of.card.tier)>=1;
  if(!dest){const fit=firstFit(of.card.size);dest=fit||(canMerge?'merge':null);
    if(!dest){toast('没地方放了：卖掉一张，或者买同名同品质的来合成');SFX.play('bad');return false;}}
  if(!buyCheck(of))return false;
  G.gold-=of.price;of.sold=true;SFX.play('buy');
  const c=newCard(of.card.key,of.card.tier,of.card.adj);G.cards.push(c);
  if(dest==='merge'){c.loc='temp';c.idx=-1;}else{c.loc=dest.z;c.idx=dest.i;}
  const cur=G.prep.cur;if(cur&&(cur.mode==='pick'||cur.mode==='gift')){cur.taken=true;cur.offers.forEach(o=>o.sold=true);}
  afterChange(c);return true;
}
function sellCard(c){const v=sellValue(c);G.gold+=v;SFX.play('sell');const r=c.el.getBoundingClientRect();FX.coins(r.left+r.width/2,r.top+r.height/2,Math.min(v,6));removeCard(c);toast('卖了 '+v+' 金');}
function checkMerges(){
  let any=null;
  for(let guard=0;guard<8;guard++){
    const groups={};
    for(const c of G.cards)if(c.tier<3){const k=c.key+'_'+c.tier;(groups[k]=groups[k]||[]).push(c);}
    let did=false;
    for(const k in groups){const g=groups[k];if(g.length<2)continue;
      const rank=c=>c.loc==='board'?0:c.loc==='stash'?1:2;
      g.sort((a,b)=>rank(a)-rank(b)||a.idx-b.idx);const[t,a]=g;
      const adjs=[t,a].map(x=>x.adj).filter(Boolean).sort((x,y)=>ADJ[y].r-ADJ[x].r);if(adjs.length)t.adj=adjs[0];
      t.hoard+=a.hoard;t.grow=(t.grow||0)+(a.grow||0);t.qp=Math.max(t.qp||0,a.qp||0);removeCard(a);t.tier++;
      if(t.loc==='temp'){const f=firstFit(t.size);if(f){t.loc=f.z;t.idx=f.i;}}
      repaint(t);any=t;did=true;break;}
    if(!did)break;
  }
  if(any){SFX.play('merge');setTimeout(()=>{if(!any.el||!G.cards.includes(any))return;restart(any.el,'merge');const r=any.el.getBoundingClientRect();
    FX.burst(r.left+r.width/2,r.top+r.height/2,TIERS[any.tier].c,30);toast(ITEMS[any.key].n+' 升到【'+TIERS[any.tier].n+'】了');},30);}
  G.cards.filter(c=>c.loc==='temp').forEach(removeCard);
}
function afterChange(placed){checkMerges();renderOwned();if(G.phase==='prep')renderPrep();updateHUD();
  if(placed&&placed.el&&G.cards.includes(placed))restart(placed.el,'land');}

/* ================= 拖拽 ================= */
/* 同一时间只允许一次拖拽；抬手、取消、切后台、失焦都会收尾，保证幽灵卡一定被清掉 */
let D=null;
function onDown(e,src){if(e.button>0)return;if(D)cancelDrag();SFX.ensure();e.preventDefault();
  D={src,pid:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,tilt:0,started:false,tgt:null};
  try{src.el.setPointerCapture(e.pointerId);}catch(_){}}
addEventListener('pointermove',e=>{if(!D||e.pointerId!==D.pid)return;if(!D.started){if(G.phase==='prep'&&Math.hypot(e.clientX-D.x0,e.clientY-D.y0)>7)startDrag();else return;}moveDrag(e);});
addEventListener('pointerup',e=>{if(!D||e.pointerId!==D.pid)return;const d=D;D=null;if(!d.started){openSheet(d.src);return;}endDrag(d);});
addEventListener('pointercancel',e=>{if(D&&e.pointerId===D.pid)cancelDrag();});
addEventListener('blur',()=>cancelDrag());
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelDrag();});
function cancelDrag(){const d=D;D=null;if(d&&d.started){d.tgt=null;endDrag(d);}sweepGhosts();}
function sweepGhosts(keep){document.querySelectorAll('.card.ghost').forEach(g=>{if(g!==keep)g.remove();});
  document.querySelectorAll('.card.lifted').forEach(el=>{if(!D||el!==D.src.el)el.classList.remove('lifted');});}
function startDrag(){
  const src=D.src,el=src.el,own=src.kind==='own';const c=own?src.card:src.offer.card;const r=el.getBoundingClientRect();
  sweepGhosts();
  const g=document.createElement('div');paintCard(g,c,'ghost');g.style.width=(c.size*cw-4)+'px';g.style.height=ch+'px';
  D.ox=(D.x0-r.left)/r.width*(c.size*cw-4);D.oy=(D.y0-r.top)/r.height*ch;
  document.body.appendChild(g);D.g=g;D.c=c;D.own=own;D.started=true;el.classList.add('lifted');
  if(own){$('#sell').classList.add('armed');$('#sellTxt').innerHTML='拖到这里卖掉<br><b>+'+sellValue(c)+'</b>';}
  markSyn(c,own?c:null);SFX.play('pick');
  if(!G.drawer){D.autoDrawer=true;setDrawer(true);}
}
function moveDrag(e){
  const x=e.clientX-D.ox,y=e.clientY-D.oy;const vx=e.clientX-D.lx;D.lx=e.clientX;D.tilt=D.tilt*.8+clamp(vx*1.4,-16,16)*.2;
  D.g.style.transform=`translate(${x}px,${y}px) rotate(${D.tilt.toFixed(1)}deg) scale(1.07)`;
  D.gx=x;D.tgt=hitTest(e.clientX,e.clientY,x);showTgt(D.tgt);
}
function inside(r,x,y,m){m=m||0;return x>=r.left-m&&x<=r.right+m&&y>=r.top-m&&y<=r.bottom+m;}
/* 插入排列：目标位置被占时，把两边的卡往外挤，腾出位置；挤不下才算失败 */
function insertPlan(z,i,size,ignore){
  const n=zoneN(z);const others=G.cards.filter(o=>o.loc===z&&o!==ignore).sort((a,b)=>a.idx-b.idx);
  if(others.reduce((s,o)=>s+o.size,0)+size>n)return null;
  const mid=i+size/2;const items=others.map(o=>({o,p:o.idx,s:o.size}));
  items.splice(items.filter(t=>t.p+t.s/2<mid).length,0,{o:null,p:i,s:size});
  let end=0;for(const t of items){t.p=Math.max(t.p,end);end=t.p+t.s;}
  let st=n;for(let j=items.length-1;j>=0;j--){const t=items[j];t.p=Math.min(t.p,st-t.s);st=t.p;}
  if(items[0].p<0)return null;
  const me=items.find(t=>!t.o);
  return{i:me.p,moves:items.filter(t=>t.o&&t.p!==t.o.idx).map(t=>[t.o,t.p])};
}
function hitTest(px,py,gx){
  const c=D.c,ig=D.own?c:null;
  if(D.own&&inside($('#sell').getBoundingClientRect(),px,py,6))return{z:'sell'};
  if(inside($('#bagBtn').getBoundingClientRect(),px,py,6)){let i=-1;for(let k=0;k+c.size<=4;k++)if(fits('stash',k,c.size,ig)){i=k;break;}return{z:'bag',i,ok:i>=0};}
  for(const z of['board','stash']){const r=$('#'+z).getBoundingClientRect();if(!inside(r,px,py,22))continue;
    if(!D.own&&c.tier<3){const o=occ(z);const under=o[clamp(Math.floor((px-r.left-4)/cw),0,zoneN(z)-1)];
      if(under&&under.key===c.key&&under.tier===c.tier)return{z:'merge',card:under};}
    const i=clamp(Math.round((gx-(r.left+4))/cw),0,zoneN(z)-c.size);
    if(fits(z,i,c.size,ig))return{z,i,ok:true,moves:[]};
    const pl=insertPlan(z,i,c.size,ig);
    return pl?{z,i:pl.i,ok:true,moves:pl.moves}:{z,i,ok:false};}
  return null;
}
function resetSlots(){for(const c of G.cards)if(c.el&&(c.loc==='board'||c.loc==='stash'))c.el.style.left=(4+c.idx*cw+2)+'px';}
function clearTgt(){document.querySelectorAll('.cell.ok,.cell.bad').forEach(x=>x.classList.remove('ok','bad'));document.querySelectorAll('.card.mergeT,.card.nudge').forEach(x=>x.classList.remove('mergeT','nudge'));$('#sell').classList.remove('hot');$('#bagBtn').classList.remove('hot','bad');resetSlots();}
function showTgt(t){clearTgt();if(!t)return;
  if(t.z==='sell'){$('#sell').classList.add('hot');return;}
  if(t.z==='bag'){$('#bagBtn').classList.add(t.ok?'hot':'bad');return;}
  if(t.z==='merge'){t.card.el.classList.add('mergeT');return;}
  if(t.moves)for(const[o,p]of t.moves)if(o.el){o.el.style.left=(4+p*cw+2)+'px';o.el.classList.add('nudge');}
  const cs=cells(t.z);for(let i=t.i;i<t.i+D.c.size;i++)if(cs[i])cs[i].classList.add(t.ok?'ok':'bad');}
function synergyAt(c,i,ignore){
  const o=occ('board').map(x=>x===ignore?null:x);const L=o[i-1],R=o[i+c.size];const tag=ITEMS[c.key].tag;
  const good=n=>n&&(ITEMS[n.key].tag===tag||n.adj==='echo'||ITEMS[n.key].charge||ITEMS[n.key].buff);
  return good(L)||good(R)||(L&&L.adj==='ignite')||((L||R)&&(c.adj==='echo'||ITEMS[c.key].charge||ITEMS[c.key].buff))||(R&&c.adj==='ignite');
}
function markSyn(c,ignore){const cs=cells('board');for(let i=0;i+c.size<=8;i++)if(fits('board',i,c.size,ignore)&&synergyAt(c,i,ignore))cs[i].classList.add('syn');}
function applyMoves(t){if(t&&t.moves)for(const[o,p]of t.moves)o.idx=p;}
function endDrag(d){
  let ok=false;
  try{
    clearTgt();document.querySelectorAll('.cell.syn').forEach(x=>x.classList.remove('syn'));
    $('#sell').classList.remove('armed');$('#sellTxt').innerHTML='背包 · 4格<br>拖进来卖掉';
    const t=d.tgt;
    if(t&&G.phase==='prep'){
      if(t.z==='sell'&&d.own){sellCard(d.src.card);afterChange();ok=true;}
      else if(t.z==='merge'&&!d.own){ok=acquire(d.src.offer,'merge');}
      else if(t.z==='bag'){if(!t.ok){toast('背包满了');SFX.play('bad');}else if(d.own){d.src.card.loc='stash';d.src.card.idx=t.i;SFX.play('place');afterChange(d.src.card);ok=true;}else ok=acquire(d.src.offer,{z:'stash',i:t.i});}
      else if(t.ok){
        if(d.own){applyMoves(t);d.src.card.loc=t.z;d.src.card.idx=t.i;SFX.play('place');afterChange(d.src.card);ok=true;}
        else if(!d.src.offer.sold&&buyCheck(d.src.offer)){const r=d.g.getBoundingClientRect();applyMoves(t);ok=acquire(d.src.offer,{z:t.z,i:t.i});if(ok)FX.burst(r.left+r.width/2,r.top+r.height/2,'#ffd166',14);else renderOwned();}
      }else if(t.z==='board'||t.z==='stash'){SFX.play('bad');toast('放不下了，先腾点位置');}
    }
  }finally{
    if(d.src.el)d.src.el.classList.remove('lifted');
    if(d.autoDrawer)setTimeout(()=>setDrawer(false),ok?350:0);
    const g=d.g;
    if(g){if(ok||!d.src.el||!d.src.el.isConnected)g.remove();
      else{const r=d.src.el.getBoundingClientRect();g.classList.add('back');g.style.transform=`translate(${r.left}px,${r.top}px) rotate(0deg) scale(1)`;setTimeout(()=>g.remove(),230);}}
  }
}

/* ================= 详情弹层 ================= */
function openSheet(src){
  const own=src.kind==='own';const c=own?src.card:src.offer.card;const it=ITEMS[c.key];const ad=c.adj?ADJ[c.adj]:null;const T=TIERS[c.tier];
  const st=stats(c,null);SFX.play('ui');
  let rows='';
  if(it.dmg>0){
    let f='('+st.base+(st.flat?' + 锋利'+st.flat:'')+')';
    if(st.psum)f+=' × (1 + '+st.pct.map(p=>p[0]+' '+Math.round(p[1]*100)+'%').join(' + ')+')';
    if(st.mult>1)f+=' × 致命1.5';
    rows+=`<div><span>单次伤害</span><span>${Math.round(st.total)}</span></div><div><span></span><span class="f">${f}</span></div>`;
    rows+=`<div><span>暴击率</span><span>${Math.round(st.crit*100)}%（伤害×2）</span></div>`;

    const mem=[];for(const k in comp)for(let i=0;i<comp[k];i++)mem.push(k);
    const sup=mem.filter(k=>EN[k].aura),rest=mem.filter(k=>!EN[k].aura);const cols=Math.min(5,Math.max(1,rest.length));
    rest.forEach((k,i)=>{const row=Math.floor(i/cols),col=i%cols;S.push({type:k,t:t+row*.35+rnd(0,.1),x:clamp(cx+(col-(cols-1)/2)*.085+rnd(-.015,.015),.05,.95),y:-.04-rnd(0,.02)});});
    sup.forEach((k,i)=>S.push({type:k,t:t+.7+i*.2,x:clamp(cx+(i-(sup.length-1)/2)*.1,.06,.94),y:-.05}));}};
  const boss=(k,t)=>S.push({type:k,t,x:.5,y:-.04});

    case 6:pack({catapult:2},1,2,2);pack({siege:1},1,8,8);pack({golem:1,shaman:1,shieldb:1},2,4,20);pack({skel:3,shieldb:1},3,0,24);pack({bug:3,drummer:1},2,2,24);pack({bat:5,bomber:2},2,4,26);pack({berserker:3,drummer:1},1,19,19);break;
    case 7:pack({siege:1},2,4,20);pack({catapult:2},1,3,3);pack({skel:3,necro:1},2,0,22);pack({golem:1,shaman:1,shieldb:1},2,6,24);pack({berserker:2,drummer:1},3,2,26);
      pack({ghost:3},2,8,24);pack({bat:5,bomber:2},3,4,28);pack({slime:6,mimic:1},2,0,20);pack({skel:4,berserker:2,shieldb:1},1,26,26);break;
    default:boss('eye',1);pack({siege:1},1,10,10);pack({catapult:1},1,6,6);pack({skel:3,necro:1},2,4,30);pack({bat:5,drummer:1},3,8,36);

    for(const p of B.pr){
      if(p.kind==='knife'){const vx=p.vx||0,vy=p.vy||-1;pline(x,p.x-vx*5,p.y-vy*5,p.x,p.y,'#f4f4f4');x.fillStyle='#94b0c2';x.fillRect(Math.round(p.x-vx*6),Math.round(p.y-vy*6),1,1);}
      else if(p.kind==='arrow'){const vx=p.vx||0,vy=p.vy||-1;pline(x,p.x-vx*7,p.y-vy*7,p.x,p.y,'#c28a4d');x.fillStyle='#f4f4f4';x.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
      else if(p.kind==='spark'){x.fillStyle='#ef7d57';x.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,3,3);x.fillStyle='#fee761';x.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
      else if(p.kind==='ice'){x.fillStyle='#41a6f6';x.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,3,3);x.fillStyle='#f4f4f4';x.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
      else if(p.kind==='fly'){const px=Math.round(p.x),py=Math.round(p.y);x.fillStyle='#a7f070';x.fillRect(px-1,py-1,3,3);x.fillStyle='#fee761';x.fillRect(px,py,1,1);if(Math.random()<.5)part(p.x,p.y,rnd(-5,5),rnd(-5,5),.3,'#a7f070',1);}
      else if(p.kind==='rock'){x.fillStyle='#566c86';x.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,3,3);x.fillStyle='#94b0c2';x.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,1,1);}
      else if(p.kind==='axe'){const f=Math.floor(p.age*24)%4;const px=Math.round(p.x),py=Math.round(p.y);x.fillStyle='#1a1c2c';x.fillRect(px-2,py-2,5,5);x.fillStyle='#dfe6ee';
        if(f%2){x.fillRect(px-2,py,5,1);x.fillRect(px,py-2,1,2);}else{x.fillRect(px,py-2,1,5);x.fillRect(px+1,py,2,1);}x.fillStyle='#c28a4d';x.fillRect(px,py,1,1);}

}

/* ================= 界面层特效 ================= */
const FX=(function(){
  const cv=$('#fx');const x=cv.getContext('2d');let items=[];let dpr=1;
  function size(){dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);x.imageSmoothingEnabled=false;}
  size();addEventListener('resize',size);
  const ctr=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+14];};
  return{
    link(a,b,col,life){if(!a||!b)return;const[x0,y0]=ctr(a),[x1,y1]=ctr(b);const pts=[];const n=8;for(let i=0;i<=n;i++){const t=i/n;pts.push([x0+(x1-x0)*t,y0+(y1-y0)*t-Math.sin(t*Math.PI)*16+(i&&i<n?rnd(-4,4):0)]);}
      items.push({k:'link',pts,col,life:life||.3,max:life||.3});},
    burst(cx,cy,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(60,200);items.push({k:'p',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,col:Math.random()<.3?'#ffffff':col,life:rnd(.35,.7),max:.7});}},
    coins(cx,cy,n){const t=$('#goldChip').getBoundingClientRect();for(let i=0;i<n;i++)items.push({k:'coin',x0:cx+rnd(-10,10),y0:cy+rnd(-10,10),x1:t.left+18,y1:t.top+t.height/2,t:-i*.06,dur:.55});},
    draw(dt){x.clearRect(0,0,innerWidth,innerHeight);
      for(const it of items){
        if(it.k==='p'){it.life-=dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.vy+=400*dt;x.globalAlpha=Math.max(0,it.life/it.max);x.fillStyle=it.col;x.fillRect(Math.round(it.x),Math.round(it.y),4,4);}
        else if(it.k==='link'){it.life-=dt;x.globalAlpha=Math.max(0,it.life/it.max);x.strokeStyle=it.col;x.lineWidth=3;x.lineJoin='miter';x.beginPath();it.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
          x.strokeStyle='#fff';x.lineWidth=1;x.stroke();}
        else if(it.k==='coin'){it.t+=dt;if(it.t<0)continue;const k=Math.min(1,it.t/it.dur),e=k*k*(3-2*k);const px=it.x0+(it.x1-it.x0)*e,py=it.y0+(it.y1-it.y0)*e-Math.sin(k*Math.PI)*40;
          x.globalAlpha=1;x.drawImage(SPR.coin.cv,Math.round(px-8),Math.round(py-8),16,16);if(k>=1)it.life=-1;else it.life=1;}
      }
      x.globalAlpha=1;items=items.filter(it=>it.life>0||(it.k==='coin'&&it.t<0));}
  };
})();

function winBattle(){
  B.over=true;G.phase='report';$('#bossbar').hidden=true;
  G.bestChain=Math.max(G.bestChain,B.maxChain);SFX.play('win');say('hero',BARKS.win,2);
  for(const c of G.cards)if(c.adj==='hoard')c.hoard++;
  for(const c of boardCards()){const w=ITEMS[c.key].onWin;if(w)w(c);}
  finishQuests();
  for(const c of G.cards){c.charge=0;c.el.style.setProperty('--s',0);c.el.classList.remove('frozen','empty','haste');c.ammo=maxAmmo(c);setAmmo(c);}
  const was=G.round;
  if(was>=G.maxRound){banner('黎明','#ffe79a');BG.set('shop');setTimeout(()=>playStory(STORY.win,()=>endScreen(true)),1400);return;}
  updateHUD();const winG=3+Math.floor(was/2);const rows=[['守夜工钱',winG]];if(was===4)rows.push(['打倒精英',4]);
  const interest=Math.min(3+mv('interest'),Math.floor(G.gold/6));if(mv('winGold'))rows.push(['遗物/天赋',mv('winGold')]);if(mv('regen'))G.wall=Math.min(G.wallMax,G.wall+mv('regen'));if(interest)rows.push(['利息（每6金+1）',interest]);
  if(B.wallLost===0)rows.push(['墙没掉砖',1]);
  if(B.greed)rows.push(['贪婪（已到账）',0,B.greed]);
  const total=rows.reduce((s,r)=>s+r[1],0);
  showReport(was,rows,total);
}
function showReport(was,rows,total){
  const rp=$('#report');const bc=G.cards.filter(c=>c.bTrig>0).sort((a,b)=>b.bDmg-a.bDmg);const mx=Math.max(1,...bc.map(c=>c.bDmg));
  rp.innerHTML=`<div class="rp-title win">第${was}夜 · ${pickLine(RPT.win)}</div>
  <div class="rp-list">${bc.map((c,i)=>`<div class="rp-row" style="animation-delay:${i*.07}s;--tagc:${TAGC[ITEMS[c.key].tag]}"><img src="${SPR[c.key].url}" alt=""><span>${ITEMS[c.key].n}</span><div class="bar"><i data-w="${(c.bDmg/mx*100).toFixed(1)}"></i></div><b>${fmt(c.bDmg)}<small>×${c.bTrig}</small></b></div>`).join('')||'<div class="rp-meta">这一夜没有卡出手</div>'}</div>
  <div class="rp-meta">${(was+1)%2===1?'<b style="color:#ffd166">明晚之前有夜谈</b>　':''}最高连锁 <b>×${B.maxChain||1}</b>　击杀 <b>${B.kills}</b>　城墙 <b>-${Math.ceil(B.wallLost)}</b></div>
  <div class="rp-cash" id="cash"></div>
  <button class="btn gold big" id="cashBtn" style="flex:none">收下 <img class="ico" src="${SPR.coin.url}" alt=""><b>${total}</b></button>`;
  rp.hidden=false;
  setTimeout(()=>rp.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),60);
  const cash=$('#cash');let i=0;
  const next=()=>{if(i<rows.length){const r=rows[i];cash.insertAdjacentHTML('beforeend',`<div class="cash-row"><span>${r[0]}</span><b>${r[2]?'+'+r[2]:'+'+r[1]}</b></div>`);SFX.play('coin');i++;setTimeout(next,220);}
    else{cash.insertAdjacentHTML('beforeend',`<div class="cash-row total"><span>合计</span><b>+${total}</b></div>`);}};
  setTimeout(next,400);
  $('#cashBtn').onclick=()=>{SFX.ensure();const r=$('#cashBtn').getBoundingClientRect();FX.coins(r.left+r.width/2,r.top,Math.min(total,10));G.gold+=total;G.round++;$('#report').hidden=true;nightStory(()=>toPrep());};
}

    <em>“${H.intro}”</em></button>`;}).join('')}</div></div>`;
  sc.hidden=false;
  sc.querySelectorAll('.hero').forEach(b=>b.onclick=()=>{SFX.ensure();SFX.play('merge');sc.hidden=true;newGame(b.dataset.h);});
}
const SAVEK='chain-demo-save-v4';
function saveGame(){try{localStorage.setItem(SAVEK,JSON.stringify({hero:G.hero,round:G.round,gold:G.gold,wall:G.wall,wallMax:G.wallMax,relics:G.relics,skills:G.skills,foeSet:G.foeSet,bestChain:G.bestChain,
  cards:G.cards.map(c=>({key:c.key,tier:c.tier,adj:c.adj,loc:c.loc,idx:c.idx,hoard:c.hoard,grow:c.grow||0,qp:c.qp||0}))}));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVEK);return s?JSON.parse(s):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVEK);}catch(e){}}
function resumeSave(){const s=loadSave();if(!s||!HEROES[s.hero]){heroSelect();return;}
  for(const c of G.cards)if(c.el)c.el.remove();
  Object.assign(G,{hero:s.hero,round:s.round,gold:s.gold,wall:s.wall,wallMax:s.wallMax,foeSet:s.foeSet||'dark',relics:s.relics||[],skills:(s.skills||[]).filter(k=>TALENTS[k]),bestChain:s.bestChain||0,cards:[]});
  for(const d of s.cards||[]){if(!ITEMS[d.key])continue;const c=newCard(d.key,d.tier,d.adj);c.loc=d.loc;c.idx=d.idx;c.hoard=d.hoard||0;c.grow=d.grow||0;c.qp=d.qp||0;G.cards.push(c);}
  recalcMods();renderRelics();shownGold=null;renderOwned();updateHUD();toPrep();toast('接着上回：第'+G.round+'夜');}
function newGame(hero){
  for(const c of G.cards)if(c.el)c.el.remove();
  G.hero=hero||G.hero;const H=HEROES[G.hero];
  Object.assign(G,{round:1,gold:H.gold,wall:H.wall,wallMax:H.wall,cards:[],relics:[],skills:[],bestChain:0,foeSet:pick(Object.keys(FOESETS))});recalcMods();renderRelics();
  for(const[k,t,i]of H.start){const c=newCard(k,t);c.loc='board';c.idx=i;G.cards.push(c);}
  shownGold=null;renderOwned();updateHUD();
  G.firstPrep=true;playStory(STORY.prologue,()=>nightStory(()=>toPrep()));
}

/* ================= 布局与主循环 ================= */
function layout(){
  const avail=Math.min(440,innerWidth)-16-8;cw=Math.floor(avail/8);
  const vh=innerHeight;ch=Math.round(clamp(Math.min(cw*2,(vh-330)/2.6),70,104));
  document.documentElement.style.setProperty('--cw',cw+'px');document.documentElement.style.setProperty('--ch',ch+'px');
  buildCells();renderOwned();requestAnimationFrame(resizeField);
}
addEventListener('resize',layout);
$('#goBtn').onclick=()=>{SFX.ensure();if(G.phase==='prep'&&G.prep.step>=3)startBattle();};
$('#bagBtn').onclick=()=>{SFX.ensure();SFX.play('ui');if(G.phase!=='battle')setDrawer(!G.drawer);else toast('打着仗呢，没空翻包');};
$('#treeBtn').onclick=()=>{SFX.ensure();openTree();};
$('#relicBtn').onclick=()=>{SFX.ensure();openBag();};
$('#speedBtn').onclick=()=>{SFX.ensure();SFX.play('ui');G.speed=G.speed>=3?1:G.speed+1;updateHUD();};
$('#muteBtn').onclick=()=>{SFX.ensure();const m=SFX.toggle();$('#muteBtn').textContent=m?'♪ 关':'♪ 开';};
let lastT=performance.now();
function loop(now){
  const dtR=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(G.phase==='battle'&&B&&!B.over){
    B.acc+=dtR*G.speed;const step=1/60;let n=0;const cap=G.speed>3?40:12;
    while(B.acc>=step&&n<cap){simStep(step);B.acc-=step;n++;if(B.over)break;}
    if(n>=cap)B.acc=0;
    if(B&&!B.over)for(const c of boardCards())c.el.style.setProperty('--s',(1-Math.min(1,c.charge)).toFixed(3));
    if(B&&B.boss){const e=B.boss;$('#bossHp').style.width=(Math.max(0,e.hp)/e.maxHp*100).toFixed(1)+'%';$('#bossSh').style.width=Math.min(100,e.shield/e.maxHp*100).toFixed(1)+'%';
      $('#bossHpT').textContent=fmt(Math.max(0,e.hp))+' / '+fmt(e.maxHp)+(e.armor+(e.hardT>0?10:0)?'  护甲'+(e.armor+(e.hardT>0?10:0)):'');
      const it=e.d.intents[e.ii];$('#intName').textContent=it.n+'：'+it.d;$('#intT').textContent=Math.max(0,e.it).toFixed(1)+'s';
      $('#intBar').style.width=(100-Math.max(0,e.it)/it.t*100).toFixed(1)+'%';$('#intentBox').classList.toggle('hot',e.it<1.2);}
    if(B&&B.shield>0)updateHUD();
  }
  if(G.phase==='battle'||G.phase==='report'||G.phase==='over')drawField(dtR*(G.phase==='battle'?G.speed:1));
  FX.draw(dtR);
  requestAnimationFrame(loop);
}
layout();titleScreen();requestAnimationFrame(loop);
window.__game={heroSelect,setDrawer,openTree,G,get B(){return B;},startBattle,acquire,toPrep,newGame,boardCards,newCard,afterChange,renderPreview,makeWave,enterEvent,finishStep,renderRelics,gainRelic,rollGear};
})();
</script>
