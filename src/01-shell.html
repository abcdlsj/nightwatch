<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1c20">
<title>代号：连锁 · 原型 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1c20; --panel:#1c2a30; --panel2:#25363d; --edge:#3a525c; --ink:#fbf7ee; --muted:#9fb3ba;
  --red:#e2473b; --blue:#2c8fe0; --gold:#f2a93b; --green:#35a86b; --purple:#8e5bd8;
  --card:#f0e4c7; --cink:#2a2130;
  --zh:'ZCOOL QingKe HuangYou','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
  --px:'Pixelify Sans','ZCOOL QingKe HuangYou','Noto Sans CJK SC',ui-monospace,monospace;
  --cw:46px; --ch:90px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 游戏本身就是暗色美术，明暗两种环境使用同一套色板 */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0f1c20; --panel:#1c2a30; } }
:root[data-theme="dark"]{ --bg:#0f1c20; --panel:#1c2a30; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#crt{position:fixed;inset:0;pointer-events:none;z-index:95;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

#app{position:relative;z-index:1;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding:8px}

/* ---------- 顶栏 ---------- */
#top{display:flex;gap:6px;align-items:stretch}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:9px;padding:3px 9px;
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06);font-family:var(--px);font-size:19px;line-height:1}
.chip .lbl{font-family:var(--zh);font-size:13px;color:var(--muted)}
.chip .sub{font-size:13px;color:var(--muted)}
.chip b{font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.chip.gold b{color:#ffd166}
.chip.hp b{color:#ff8a80}
.chip .shd{color:#8fe3ff;font-size:14px}
.chip.bump{animation:bump .3s}
.chip.shake{animation:shakeX .35s}
.ico{width:16px;height:16px;image-rendering:pixelated;display:block}
#top .sp{flex:1}
#roundChip b{color:#fff}
#roundChip.elite b{color:#ff9e5e}#roundChip.boss b{color:#ff5a5a}

/* ---------- 按钮 ---------- */
.btn{color:#fff;background:var(--edge);border:0;border-radius:10px;padding:8px 14px;font-size:18px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.5);text-shadow:0 2px 0 rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .08s,box-shadow .08s,filter .15s;line-height:1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:default}
.btn.sm{font-size:15px;padding:6px 10px;border-radius:8px}
.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold)}.btn.green{background:var(--green)}
.btn.big{font-size:22px;padding:12px 18px;flex:1}
.btn.on{background:#c9933a}
.btn b{font-family:var(--px)}

/* ---------- 舞台 ---------- */
#stage{position:relative;flex:1;min-height:200px;border-radius:14px;overflow:hidden;background:rgba(8,14,18,.55);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.4)}
#field{position:absolute;top:0;image-rendering:pixelated;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;gap:7px;padding:9px}
.layer[hidden]{display:none}
#prep{background:linear-gradient(to bottom,rgba(10,22,24,.35),rgba(10,22,24,.72))}

#preview{background:rgba(0,0,0,.32);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:5px;flex:none}
#preview .ph{display:flex;align-items:baseline;gap:8px}
#preview .ph span{font-size:13px;color:var(--muted)}
#preview .ph b{font-size:18px;font-weight:400}
#pvList{display:flex;flex-wrap:wrap;gap:4px;max-height:58px;overflow:hidden}
.pv{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);border-radius:6px;padding:1px 6px 1px 1px;font-family:var(--px);font-size:13px}
.pv img{width:24px;height:24px;image-rendering:pixelated}
.pv.elite{background:rgba(226,71,59,.35);box-shadow:inset 0 0 0 2px rgba(255,120,100,.5)}
#pvNote{font-size:12px;color:#ffc3b8;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#pvNote:empty{display:none}

#shopHead{display:flex;align-items:center;gap:6px}
#shopHead h2{margin:0;font-weight:400;font-size:22px;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#offers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;justify-content:center;min-height:0}
.offer{position:relative;background:var(--panel2);border-radius:11px;padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.05);min-height:0}
.offer .oname{font-size:15px;margin-top:2px}
.offer .oadj{font-size:13px;min-height:15px}
.offer .osz{font-size:12px;color:var(--muted)}
.offer .oflav{display:none}
.price.free{color:#9bf0b8;background:#173a28}
.offer .odesc{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:11px;line-height:1.35;color:#c5d2d6;text-align:center;padding:0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.offer .card.static{transform:scale(1.12);transform-origin:center top;margin-bottom:10px}
.price{margin-top:3px;display:inline-flex;align-items:center;gap:3px;background:#3b2a12;border-radius:7px;padding:3px 7px;font-family:var(--px);font-size:16px;color:#ffd166;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.price.cant{color:#b08a70;background:#2b2320}
.offer.sold{opacity:.35}
.offer.sold .card{visibility:hidden}
.offer.sold::after{content:'已售';position:absolute;top:36%;left:0;right:0;text-align:center;font-size:18px;color:var(--muted)}

/* ---------- 卡牌 ---------- */
.card{position:absolute;top:4px;width:calc(var(--cw) * var(--sz) - 4px);height:var(--ch);cursor:grab;touch-action:none;
  transition:left .2s cubic-bezier(.3,1.4,.5,1)}
.card .inner{position:absolute;inset:0;animation:bob 3.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
.card .face{position:absolute;inset:0;border-radius:8px;background:var(--tbg,var(--card));border:3px solid var(--tc,var(--cink));overflow:hidden;
  box-shadow:0 3px 0 rgba(0,0,0,.55),0 0 0 2px var(--cink),inset 0 0 0 1px rgba(0,0,0,.35)}
.card .tb{position:absolute;left:-6px;top:-7px;height:19px;min-width:19px;padding:0 3px;border-radius:5px;background:var(--tc);color:#1b1224;font-size:13px;line-height:19px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 0 0 2px #1b1224;z-index:2}
.card.t3 .tb{background:linear-gradient(135deg,#8ff4ff,#45dcff 50%,#e0b3ff)}
.card.t2 .tb{background:linear-gradient(135deg,#fff1a8,#ffc328)}
.card .band{height:8px;background:var(--tagc);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.card .nm{font-size:12px;color:var(--cink);text-align:center;line-height:1;margin-top:2px;white-space:nowrap}
.card .spr{display:block;width:32px;height:32px;margin:3px auto 0;image-rendering:pixelated}
.card.s3 .spr{width:48px;height:48px;margin-top:0}
.card .num{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:'Silkscreen','Pixelify Sans',ui-monospace,monospace;font-weight:700;font-size:15px;color:var(--cink);line-height:1;letter-spacing:.5px}
.card .cdv{position:absolute;left:0;right:0;top:8px;bottom:0;background:rgba(24,14,40,.5);transform-origin:top;transform:scaleY(var(--s,0))}
.card .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.card .holo{position:absolute;inset:0;pointer-events:none}
.card.t3 .holo{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 44%,rgba(200,150,255,.4) 50%,transparent 62%);
  background-size:260% 100%;animation:holo 2.6s linear infinite;mix-blend-mode:overlay}
.card .gem{position:absolute;left:5px;top:3px;width:7px;height:7px;background:var(--tc);transform:rotate(45deg);box-shadow:0 0 0 1px var(--cink);z-index:1}
.card.t1 .gem{box-shadow:0 0 0 1px var(--cink),0 0 3px #fff}
.card.t2 .inner{filter:drop-shadow(0 0 4px rgba(255,201,60,.65))}
.card.t3 .inner{filter:drop-shadow(0 0 6px rgba(111,230,255,.85))}
.card.t3 .gem{animation:tw .7s infinite alternate}
.card.rare .adj{box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 0 0 2px #1b1224,0 0 8px var(--ac)}
.card .adj{position:absolute;bottom:-7px;right:-6px;min-width:21px;height:21px;padding:0 3px;border-radius:6px;background:var(--ac);color:#1b1224;
  font-size:14px;line-height:21px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 0 0 2px #1b1224;z-index:2}
.card.pop{animation:pop .24s ease-out}
.card.pop .flash{animation:flash .24s ease-out}
.card.land{animation:land .32s ease-out}
.card.lifted{opacity:.25}
.card .am{position:absolute;right:2px;bottom:24px;z-index:3;font-size:9px;line-height:1;padding:1px 3px;border-radius:3px;background:#1a1c2cdd;color:#ffd166;font-weight:700;pointer-events:none}
.card.empty .face{filter:grayscale(1) brightness(.55)}
.card.haste .face{box-shadow:0 0 0 2px #8ff0c8,0 0 10px #8ff0c8aa}
.kwbox{margin:8px 0;padding:6px 8px;border-radius:8px;background:#ffffff0d;font-size:12px;display:grid;gap:3px}
.kwbox b{color:#ffd166;margin-right:6px}.kwbox span{color:var(--muted)}
.card.frozen .face::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(130,215,255,.6) 0 4px,rgba(210,245,255,.45) 4px 8px)}
.card.mergeT .face{box-shadow:0 3px 0 rgba(0,0,0,.55),inset 0 0 0 3px #ffd34d;animation:glow .6s infinite alternate}
.card.merge{animation:mergeA .5s ease-out}
.card.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;transition:none}
.card.ghost .inner{animation:none;filter:drop-shadow(0 12px 10px rgba(0,0,0,.55))}
.card.ghost.back{transition:transform .22s ease-in}
.card.nudge .face{box-shadow:0 3px 0 rgba(0,0,0,.55),0 0 0 2px #8ff0bb}
.card.static{position:relative;top:0;left:auto;flex:none;height:84px;cursor:grab}
.card.static.s1{width:46px}.card.static.s2{width:64px}.card.static.s3{width:82px;max-width:100%}
@media (hover:hover){.card:not(.ghost):hover .inner{transform:translateY(-3px) scale(1.04);animation-play-state:paused}}

/* ---------- 棋盘 ---------- */
#stashRow{display:flex;gap:7px}
#stashRow{max-height:calc(var(--ch) + 12px);transition:max-height .25s ease,opacity .2s,margin .25s;overflow:visible}
#stashRow.closed{max-height:0;opacity:0;margin-top:-7px;overflow:hidden;pointer-events:none}
#stash,#board{position:relative;height:calc(var(--ch) + 8px);border-radius:11px;background:rgba(0,0,0,.38);
  box-shadow:inset 0 3px 0 rgba(0,0,0,.35),0 3px 0 rgba(255,255,255,.04)}
#stash{width:calc(var(--cw) * 4 + 8px);flex:none;background:rgba(0,0,0,.28)}
#board{width:calc(var(--cw) * 8 + 8px);margin:0 auto;background:linear-gradient(rgba(60,40,26,.55),rgba(30,20,14,.7))}
.cell{position:absolute;top:4px;width:calc(var(--cw) - 4px);height:var(--ch);border-radius:8px;background:rgba(0,0,0,.25);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.cell.ok{background:rgba(53,168,107,.5);box-shadow:inset 0 0 0 2px #8ff0bb}
.cell.bad{background:rgba(226,71,59,.45)}
.cell.syn::after{content:'✦';position:absolute;top:36%;left:0;right:0;text-align:center;color:#ffd34d;font-size:18px;animation:tw .8s infinite alternate;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#sell{flex:1;border-radius:11px;border:2px dashed rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-size:14px;text-align:center;padding:4px;line-height:1.35;transition:transform .12s,background .12s}
#sell b{font-family:var(--px);color:#ffd166;font-size:18px}
#sell.armed{border-color:var(--gold);color:#ffd9a0;background:rgba(242,169,59,.12)}
#sell.hot{background:rgba(242,169,59,.32);transform:scale(1.04)}
#boardRow{position:relative}

#actions{display:flex;gap:7px}
#speedBtn{min-width:44px;font-family:var(--px);font-weight:700;padding:8px 8px;flex:none}
#goBtn{font-size:19px;padding:10px 8px;white-space:nowrap;min-width:0}
.fb{position:relative;flex-direction:column;font-size:12px;padding:5px 6px 4px;gap:2px;min-width:46px;flex:none}
.fb .ico{width:18px;height:18px}
.fb sup{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);font-family:var(--px);font-size:12px;padding:0 4px;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.fb sup:empty{display:none}
#bagBtn.on{background:#5a4a2a}#bagBtn.hot{background:var(--green);transform:scale(1.08)}#bagBtn.bad{background:var(--red)}
#treeBtn.glow{animation:glow .8s infinite alternate;box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 12px #ffd166}

/* ---------- 战斗 UI ---------- */
#bossbar{position:absolute;left:8px;right:8px;top:8px;background:rgba(20,6,10,.8);border-radius:10px;padding:6px 8px;
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,90,90,.35);display:flex;flex-direction:column;gap:4px;z-index:3}
#bossbar[hidden]{display:none}
#bossbar .bn{display:flex;justify-content:space-between;font-size:16px}
#bossbar .bn span{font-family:var(--px);font-size:14px;color:#ffb3a8}
.bhp{position:relative;height:9px;background:#1a1c2c;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.bhp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6b5b,#b8231a);transition:width .12s}
.bhp s{position:absolute;left:0;top:0;height:3px;background:#dfe6ee}
.intent{position:relative;display:flex;align-items:center;gap:6px;font-size:14px;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 6px;overflow:hidden}
.intent em{font-style:normal;font-family:var(--px);color:#ffd166;margin-left:auto}
.intent i{position:absolute;left:0;bottom:0;height:2px;background:#ff8a5b}
.intent.hot{background:rgba(255,80,60,.35);animation:blink .3s infinite alternate}
#chain{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:26px;pointer-events:none;opacity:0;z-index:4;
  text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 12px var(--cc,#c38cff);color:var(--cc,#e8d4ff)}
#chain.show{animation:chainPop .9s ease-out forwards}
#chain b{font-family:var(--px);font-size:30px}
#toast{position:absolute;left:50%;top:12px;transform:translate(-50%,0);background:rgba(20,14,26,.92);padding:9px 16px;border-radius:10px;font-size:17px;
  box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.1);opacity:0;pointer-events:none;z-index:6;width:max-content;max-width:92%;text-align:center}
#toast.show{animation:toastA 1.8s ease-out forwards}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:40px;pointer-events:none;opacity:0;z-index:5;
  text-shadow:0 4px 0 rgba(0,0,0,.6)}
#banner.show{animation:bannerA 1.3s ease-out forwards}
#combo{position:absolute;right:10px;top:22%;font-size:20px;pointer-events:none;opacity:0;z-index:4;color:var(--kc,#fff);text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 10px var(--kc,#fff)}
#combo.show{animation:comboA 1.5s ease-out forwards}
#combo b{font-family:var(--px);font-size:26px}
@keyframes comboA{0%{opacity:0;transform:scale(1.5)}10%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
#pvSyn{display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer}
#pvSyn:empty{display:none}
#pvSyn .sy-l{font-size:12px;color:var(--muted)}
#pvSyn .sy{font-size:13px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:#8a979c}
#pvSyn .sy.on{background:color-mix(in srgb,var(--tagc) 28%,transparent);color:#fff;box-shadow:inset 0 0 0 1px var(--tagc)}
#pvSyn .sy b{font-family:var(--px);font-weight:400;margin-left:3px}#pvSyn .sy small{opacity:.6}
.wagers{display:flex;flex-direction:column;gap:6px;margin-top:10px;width:100%}
.wg-t{font-size:16px;color:#ffb37a;text-align:center}.wg-t small{font-size:12px;color:var(--muted);margin-left:6px}
.wg{display:grid;grid-template-columns:auto 1fr;gap:0 10px;text-align:left;color:#fff;border:0;border-radius:10px;padding:6px 10px;background:var(--panel2);cursor:pointer;font:inherit}
.wg b{font-weight:400;font-size:17px;color:#ff8a5b;grid-row:span 2;align-self:center}.wg span{font-size:13px}.wg em{font-style:normal;font-size:12px;color:#9bf0b8}
.wg.on{box-shadow:inset 0 0 0 2px #ff8a5b;background:rgba(255,120,80,.18)}
.achpop{position:fixed;left:50%;transform:translateX(-50%);z-index:96;background:rgba(24,18,8,.95);border-radius:10px;padding:7px 14px;box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 0 0 2px #ffd166;
  display:flex;flex-direction:column;align-items:center;min-width:220px;max-width:92vw;pointer-events:none;animation:achA 3.2s ease-out forwards}
.achpop small{font-size:11px;color:#ffd166;letter-spacing:2px}.achpop b{font-weight:400;font-size:18px;color:#ffe79a}.achpop span{font-size:12px;color:#c9bda8;text-align:center}
@keyframes achA{0%{opacity:0;transform:translate(-50%,-12px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
#sheet.top{z-index:90}
.trow.ach:not(.got){opacity:.6}.trow.ach span{font-size:13px;color:#c5d2d6}
.heatsel{display:flex;align-items:center;gap:8px;width:100%;background:rgba(10,16,22,.75);border-radius:12px;padding:6px 8px;box-shadow:inset 0 0 0 2px rgba(255,138,91,.35)}
.heatsel div{flex:1;display:flex;flex-direction:column;text-align:left}.heatsel b{font-weight:400;font-size:18px;color:#ff8a5b}
.heatsel small{font-size:12px;color:#c9bda8;line-height:1.45}.heatsel i{font-style:normal;color:#ffd166;font-family:var(--px)}
.newheat{font-size:15px;color:#ffb37a}.newheat b{font-weight:400;color:#ff8a5b}
.achgot b{font-weight:400;color:#ffe79a}

/* ---------- 战报 ---------- */
#report{background:rgba(10,14,20,.8);justify-content:flex-start}
.rp-title{font-size:26px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.rp-title.win{color:#9bf0b8}
.rp-list{display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0;flex:1}
.rp-row{display:grid;grid-template-columns:34px 44px 1fr auto;align-items:center;gap:6px;font-size:14px;opacity:0;animation:rowIn .3s ease-out forwards}
.rp-row img{width:32px;height:32px;image-rendering:pixelated}
.rp-row .bar{height:9px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}

.card .face::before{content:'';position:absolute;left:2px;right:2px;top:10px;bottom:2px;border:1px solid rgba(40,28,20,.14);border-radius:4px;pointer-events:none}
.card.t1 .face::before{border-color:rgba(120,140,165,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.card.t2 .face::before{border:1px solid rgba(190,130,20,.6);
  background:linear-gradient(#c8901e,#c8901e) left top/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) left top/1px 5px no-repeat,
  linear-gradient(#c8901e,#c8901e) right top/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) right top/1px 5px no-repeat,
  linear-gradient(#c8901e,#c8901e) left bottom/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) left bottom/1px 5px no-repeat,
  linear-gradient(#c8901e,#c8901e) right bottom/5px 1px no-repeat,linear-gradient(#c8901e,#c8901e) right bottom/1px 5px no-repeat}
.card.t3 .face::before{border-color:rgba(80,200,255,.7);box-shadow:inset 0 0 6px rgba(120,230,255,.45)}
.card.t2 .holo{background:linear-gradient(115deg,transparent 40%,rgba(255,250,220,.55) 48%,transparent 56%);background-size:300% 100%;animation:holo 5.5s linear infinite;mix-blend-mode:overlay}
.card.t3 .inner::before{content:'';position:absolute;inset:-2px;border-radius:10px;background:conic-gradient(from var(--ang,0deg),#6fe6ff,#e0b3ff,#fff3b0,#6fe6ff);animation:spinB 3s linear infinite;z-index:-1}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinB{to{--ang:360deg}}
.card .spr{filter:drop-shadow(0 1px 0 rgba(0,0,0,.28))}
.card .nm.long{font-size:10px;letter-spacing:-.5px}
.card.t3 .nm{color:#1b3a5c;font-weight:700}
.sh h3 .dn{background:linear-gradient(90deg,#8ff4ff,#e0b3ff,#fff3b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sh h3 .bn{font-size:14px;color:var(--muted);margin-left:6px}
.lore{border-radius:9px;padding:8px 11px;background:linear-gradient(135deg,rgba(255,201,60,.12),rgba(0,0,0,.25));box-shadow:inset 3px 0 0 #ffc93c}
.lore small{font-size:12px;color:#ffc93c;letter-spacing:2px}
.lore p{margin:3px 0 0;font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-size:13px;line-height:1.6;color:#efe3c6}
.lore .dl{color:#bfefff;font-style:italic}
.lore.dia{background:linear-gradient(135deg,rgba(111,230,255,.14),rgba(224,179,255,.1),rgba(0,0,0,.25));box-shadow:inset 3px 0 0 #6fe6ff}
.lore.dia small{color:#8ff4ff}
.lore.locked{background:rgba(0,0,0,.2);box-shadow:inset 3px 0 0 rgba(255,255,255,.15)}
.lore.locked small{color:var(--muted)}.lore.locked p{color:var(--muted);font-style:italic}
.scr{margin:auto}
/* ---------- 动画 ---------- */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-2px) rotate(.7deg)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-3deg)}70%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
@keyframes land{0%{transform:translateY(-12px) scale(1.08)}55%{transform:translateY(2px) scale(1.04,.94)}100%{transform:none}}
@keyframes mergeA{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(6deg)}60%{transform:scale(.9) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes holo{0%{background-position:130% 0}100%{background-position:-130% 0}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25)}}
@keyframes tw{from{opacity:.4;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes blink{from{filter:brightness(1)}to{filter:brightness(1.4)}}
@keyframes chainPop{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.25)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
@keyframes bannerA{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}18%{opacity:1;transform:scale(1) rotate(-2deg)}75%{opacity:1}100%{opacity:0;transform:scale(.9)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes logoB{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
/* ---------- 矮屏：整页不超过一屏 ---------- */
@media (max-height:760px){
  .logo{font-size:64px}.rules{font-size:14px;padding:10px 12px;gap:5px}.scr{gap:9px}
  .hero em{display:none}.hero p{font-size:11.5px}
  .door{min-height:56px;padding:7px 10px}.door img{width:40px;height:40px}.door b{font-size:18px}.door span{font-size:13px}
  .offer .card.static{transform:none;margin-bottom:2px}.offer .oadj{display:none}
  .ptitle{font-size:18px}.ev-head{padding:5px 8px}.ev-head img{width:32px;height:32px}.ev-head b{font-size:17px}
  .rd-t{font-size:28px}.ready .muted{display:none}
  .opt em{display:none}.tl p{font-size:12.5px;padding:4px 8px}
}
#prep.talking #preview{display:none}
@media (prefers-reduced-motion: reduce){
  .card .inner,.logo span,.card.t3 .holo{animation:none}
}
</style>
</head>

</div>
