<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1c20">
<meta name="application-name" content="Night Watch">
<title>Night Watch</title>
<meta name="description" content="竖屏像素风自动战斗构筑：摆卡、合成、连锁触发，守住最后一道城墙，撑过九个长夜。打开网页就能玩。">
<meta property="og:title" content="Night Watch">
<meta property="og:description" content="竖屏像素风自动战斗构筑：摆卡、合成、连锁触发，守住最后一道城墙，撑过九个长夜。">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Watch">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/favicon-64.png">
<link rel="preload" href="/fonts/zcool.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fusion.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div id="edge" aria-hidden="true"></div>
<canvas id="bg"></canvas>
<div id="app">
  <header id="top">
    <div class="chip" id="roundChip"><span class="lbl" data-i18n="hud.nightPre">第</span><b id="roundV">1</b><span class="sub" data-i18n="hud.nightPost">夜</span></div>
    <div class="chip gold" id="goldChip"><img class="ico" data-ico="coin" alt=""><b id="goldV">0</b></div>
    <div class="chip hp" id="hpChip"><img class="ico" data-ico="heart" alt=""><b id="hpV">30</b><span class="shd" id="shV"></span></div>
    <div id="relics"></div>
    <button class="btn sm" id="muteBtn" data-i18n-aria="hud.mute" aria-label="开关声音">♪ 开</button>
  </header>
  <section id="stage">
    <canvas id="field"></canvas>
    <div id="bossbar" hidden>
      <div class="bn"><span id="bossName"></span><span id="bossHpT"></span></div>
      <div class="bhp"><i id="bossHp"></i><s id="bossSh"></s></div>
      <div class="intent" id="intentBox"><span data-i18n="battle.nextIntent">下一招</span><strong id="intName" style="font-weight:400"></strong><em id="intT"></em><i id="intBar"></i></div>
    </div>
    <div id="prep" class="layer" hidden>
      <div id="preview">
        <div class="ph"><span data-i18n="prep.tonight">今晚</span><b id="pvTitle"></b><span class="steps" id="stepPips"></span></div>
        <div id="pvList"></div>
        <div id="pvNote"></div>
        <div id="pvSyn"></div>
      </div>
      <div id="pbody"></div>
    </div>
    <div id="report" class="layer" hidden></div>
    <div id="chain"></div>
    <div id="combo"></div>
    <div id="bark" class="bark" aria-live="polite"></div>
    <div id="foeCard"></div>
    <div id="banner"></div>
    <div id="toast"></div>
  </section>
  <section id="stashRow" class="closed">
    <div id="stash" data-i18n-aria="hud.stash" aria-label="仓库"></div>
    <div id="sell"><span id="sellTxt" data-i18n="prep.sellHere">拖到这里出售</span></div>
  </section>
  <section id="boardRow"><div id="board" data-i18n-aria="hud.board" aria-label="棋盘"></div></section>
  <footer id="actions">
    <button class="btn" id="speedBtn">1×</button>
    <button class="btn fb" id="bagBtn" data-i18n-aria="hud.bag" aria-label="背包"><img class="ico" data-ico="chest" alt=""><span data-i18n="hud.bag">背包</span><sup id="bagN"></sup></button>
    <button class="btn fb" id="treeBtn" data-i18n-aria="hud.talents" aria-label="天赋"><img class="ico" data-ico="altar" alt=""><span data-i18n="hud.talents">天赋</span><sup id="treeN"></sup></button>
    <button class="btn fb" id="relicBtn" data-i18n-aria="hud.relics" aria-label="遗物"><img class="ico" data-ico="bag" alt=""><span data-i18n="hud.relics">遗物</span><sup id="relicN"></sup></button>
    <button class="btn red big" id="goBtn" data-i18n="hud.fight">开战</button>
  </footer>
</div>
<canvas id="fx"></canvas>
<div id="sheet" hidden></div>
<div id="screen" hidden></div>
<div id="story" hidden></div>
<div id="crt"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
